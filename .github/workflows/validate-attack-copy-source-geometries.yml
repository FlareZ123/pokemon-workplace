name: Validate attack-copy source geometries

on:
  push:
    paths:
      - "tools/attack_copy_kernel.py"
      - "results/attack_copy_source_geometries/**"
      - "results/attack_copy_optional_selection/**"
      - ".github/workflows/validate-attack-copy-source-geometries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run source-geometry regression
        run: python results/attack_copy_source_geometries/reproduce.py
      - name: Run optional-copy regression
        run: python results/attack_copy_optional_selection/reproduce.py
