name: Validate Secret Box recyclable discard certificate

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/discard_gate_recycling_bounds.py"
      - ".github/workflows/validate-secret-box-discard-recycling.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/discard_gate_recycling_bounds.py
