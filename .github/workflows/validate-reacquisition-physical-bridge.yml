name: Validate reacquisition physical bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "results/reacquisition_physical_bridge/**"
      - "tools/trainer_search_transaction.py"
      - "tools/search_zone_transition.py"
      - "tools/typed_search_retrieval.py"
      - "tools/typed_search_target_allocator.py"
      - "tools/discard_cost_witness.py"
      - ".github/workflows/validate-reacquisition-physical-bridge.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce physical reacquisition bridge
        run: python results/reacquisition_physical_bridge/reproduce.py
