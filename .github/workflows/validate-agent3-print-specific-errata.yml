name: Validate agent3 print-specific errata

on:
  push:
    paths:
      - "tools/official_print_errata.py"
      - "tools/build_expanded_legality_baseline.py"
      - "tools/reprint_errata_resolution.py"
      - "tools/current_card_semantics.py"
      - "tools/tool_category_normalization.py"
      - "tools/historical_reprint_evidence.py"
      - "tools/reprint_negative_evidence.py"
      - "tools/reprint_positive_evidence.py"
      - "tools/reprint_semantic_benchmark.py"
      - "tools/reprint_divergence_predicates.py"
      - "tools/trainer_boilerplate_candidate_audit.py"
      - "tools/trainer_boilerplate_normalization.py"
      - "results/print_specific_errata_audit/**"
      - "results/reprint_errata_resolution/**"
      - "results/tool_category_normalization/**"
      - "results/historical_reprint_bridge/**"
      - "results/reprint_negative_evidence/**"
      - "results/reprint_positive_evidence/**"
      - "results/reprint_semantic_benchmark/**"
      - "results/reprint_divergence_predicates/**"
      - "results/trainer_boilerplate_candidate_audit/**"
      - "results/trainer_boilerplate_normalization/**"
      - ".github/workflows/validate-agent3-print-specific-errata.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/print_specific_errata_audit/reproduce.py
      - run: python results/reprint_errata_resolution/reproduce.py
      - run: python results/tool_category_normalization/reproduce.py
      - run: python results/historical_reprint_bridge/reproduce.py
      - run: python results/reprint_negative_evidence/reproduce.py
      - run: python results/reprint_positive_evidence/reproduce.py
      - run: python results/reprint_semantic_benchmark/reproduce.py
      - run: python results/reprint_divergence_predicates/reproduce.py
      - run: python results/trainer_boilerplate_normalization/reproduce.py
      - run: python results/trainer_boilerplate_candidate_audit/reproduce.py
