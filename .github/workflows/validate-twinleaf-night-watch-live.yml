name: Validate pinned Twinleaf Night Watch live random hook

on:
  # Manual-only under repository CI budget rule.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  night-watch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize pinned Twinleaf only
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - uses: actions/setup-node@v4
        with:
          node-version-file: vendor/twinleafgg/.nvmrc
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install dependencies
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore compiled server
        id: compiled
        uses: actions/cache/restore@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Compile pinned server if uncached
        if: steps.compiled.outputs.cache-hit != 'true'
        working-directory: vendor/twinleafgg/ptcg-server
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - name: Cache compiled server for other pinned-match workflows
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Verify real reducer random choice and physical zones
        run: node simulation/twinleaf/test-night-watch-live-hook.cjs
      - name: Verify real Twinleaf Store resolves random Night Watch physical movement
        run: node simulation/twinleaf/test-night-watch-real-store.cjs
      - name: Reproduce independent pinned random-hand source defects
        run: node simulation/twinleaf/test-random-hand-source-gaps.cjs
      - name: Validate ten source-pinned random-hand one-card reducer hooks
        run: node simulation/twinleaf/test-random-hand-single-hook.cjs
      - name: Verify live matchup runner installs four rules hooks
        run: node simulation/twinleaf/test-tournament-engine-hooks.cjs
