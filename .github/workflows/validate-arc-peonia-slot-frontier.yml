name: Validate Arc Peonia Slot Frontier

on:
  push:
    paths:
      - "tools/arc_peonia_slot_frontier.py"
      - "tools/rotom_arc_peonia_incidence.py"
      - "results/arc_peonia_slot_frontier/**"
      - ".github/workflows/validate-arc-peonia-slot-frontier.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m tools.arc_peonia_slot_frontier
