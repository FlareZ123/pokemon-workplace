name: Validate K0 first-Item Regidrago joint launch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python results/regidrago_k0_joint_launch/reproduce.py
      - run: python results/regidrago_k0_joint_launch/physical_oracle.py
      - run: python results/regidrago_k0_joint_launch/universal_witness.py
