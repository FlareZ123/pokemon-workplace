name: Validate curated playable deck catalog

on:
  push:
    paths:
      - "results/decks/**"
      - "results/competitive_deck_baselines/**"
      - "tools/curated_deck_catalog_audit.py"
      - ".github/workflows/validate-curated-deck-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare every curated 60 to validated baseline
        run: python tools/curated_deck_catalog_audit.py
