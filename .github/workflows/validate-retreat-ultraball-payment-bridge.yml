name: Validate Dashing Pouch Ultra Ball Retreat bridge

on:
  push:
    paths:
      - "tools/retreat_action_enumerator.py"
      - "tools/trainer_search_transaction.py"
      - "results/retreat_ultraball_payment_bridge/**"
      - ".github/workflows/validate-retreat-ultraball-payment-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compose physical Retreat and Ultra Ball search
        run: |
          python results/retreat_ultraball_payment_bridge/reproduce.py
          python results/retreat_resource_allocation_frontier/reproduce.py
          python results/trainer_search_transaction/reproduce.py
