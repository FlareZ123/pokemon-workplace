name: Validate reacquisition transaction bridge

on:
  push:
    paths:
      - "tools/temporal_resource_ledger.py"
      - "tools/trainer_search_transaction.py"
      - "tools/trainer_search_profile_compiler.py"
      - "tools/typed_search_retrieval.py"
      - "tools/typed_search_target_allocator.py"
      - "results/reacquisition_transaction_bridge/**"
      - ".github/workflows/validate-reacquisition-transaction-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/reacquisition_transaction_bridge/reproduce.py
