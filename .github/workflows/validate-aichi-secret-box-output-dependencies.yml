name: Validate Aichi Secret Box output dependencies

on:
  push:
    paths:
      - "tools/aichi_vileplume_secret_box.py"
      - "tools/aichi_secret_box_output_dependencies.py"
      - "results/aichi_secret_box_output_dependencies/**"
      - ".github/workflows/validate-aichi-secret-box-output-dependencies.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/aichi_secret_box_output_dependencies/reproduce.py
