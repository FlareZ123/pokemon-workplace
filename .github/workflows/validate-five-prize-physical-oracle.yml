name: Verify five-Prize physical projection oracle

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/five_prize_physical_projection_oracle.py"
      - ".github/workflows/validate-five-prize-physical-oracle.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/five_prize_physical_projection_oracle.py
