name: Validate Prize-trigger policy bounds

on:
  push:
    paths:
      - "tools/prize_trigger_policy_bounds.py"
      - "results/prize_trigger_policy_bounds/**"
      - ".github/workflows/validate-prize-trigger-policy-bounds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate exact policy-interval posterior bounds
        run: python results/prize_trigger_policy_bounds/reproduce.py
