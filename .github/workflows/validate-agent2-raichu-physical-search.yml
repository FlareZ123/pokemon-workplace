name: Validate agent2 Raichu physical search bridge

on:
  push:
    paths:
      - "tools/trainer_search_transaction.py"
      - "tools/single_output_search_profile_compiler.py"
      - "tools/typed_search_target_allocator.py"
      - "tools/discard_cost_witness.py"
      - "tools/search_zone_transition.py"
      - "tools/multicopy_zone_state.py"
      - "results/raichu_physical_search_bridge/**"
      - ".github/workflows/validate-agent2-raichu-physical-search.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Harto physical search bridge
        run: python results/raichu_physical_search_bridge/reproduce.py
