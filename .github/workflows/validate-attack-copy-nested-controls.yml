name: Validate nested attack-copy controls

on:
  push:
    paths:
      - "tools/attack_copy_kernel.py"
      - "tools/attack_copy_outer_control.py"
      - "tools/attack_copy_controlled_execution.py"
      - "tools/attack_copy_kernel_compiler.py"
      - "results/attack_copy_nested_controls/**"
      - ".github/workflows/validate-attack-copy-nested-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check nested controlled copy execution
        run: python results/attack_copy_nested_controls/reproduce.py
