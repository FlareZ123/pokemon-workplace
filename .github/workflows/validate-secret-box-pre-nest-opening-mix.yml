name: Validate pre-Nest Ball opening mixture

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/secret_box_pre_nest_opening_mix.py"
      - "tools/secret_box_pre_nest_information.py"
      - "tools/secret_box_nest_ball_k0.py"
      - "results/secret_box_pre_nest_opening_mix/**"
      - ".github/workflows/validate-secret-box-pre-nest-opening-mix.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/secret_box_pre_nest_opening_mix/reproduce.py
