name: Validate Aichi 2026 Raichu English print legality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate complete Raichu 60 and paper Expanded eligibility
        run: python results/tests/raichu_2026_print_validation/reproduce.py
      - name: Verify Energy-unit and Prize-state burst ceilings
        run: python results/tests/raichu_2026_print_validation/prize_energy_modes.py
      - name: Exact duplicate-Prize comparison 2024 versus 2026
        run: python results/tests/raichu_2026_print_validation/compare_2024.py
