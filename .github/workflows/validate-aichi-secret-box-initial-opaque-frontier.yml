name: Validate initial Secret Box opaque frontier

on:
  push:
    paths:
      - "tools/aichi_secret_box_initial_opaque_frontier.py"
      - "results/aichi_secret_box_initial_opaque_frontier/**"
      - ".github/workflows/validate-aichi-secret-box-initial-opaque-frontier.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce initial opaque frontier
        env:
          PYTHONPATH: tools
        run: python results/aichi_secret_box_initial_opaque_frontier/reproduce.py
