name: Validate Raichu prize-aware source-payment frontier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Exact Raichu target acquisition versus source-discard policy
        run: python results/raichu_prize_source_policy/reproduce.py
