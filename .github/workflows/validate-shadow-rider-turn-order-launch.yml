name: validate Shadow Rider turn-order launch

on:
  push:
    paths:
      - "results/shadow_rider_turn_order_launch/**"
      - "results/shadow_rider_radiant_launch/reproduce.py"
      - ".github/workflows/validate-shadow-rider-turn-order-launch.yml"
  pull_request:
    paths:
      - "results/shadow_rider_turn_order_launch/**"
      - "results/shadow_rider_radiant_launch/reproduce.py"
      - ".github/workflows/validate-shadow-rider-turn-order-launch.yml"
  workflow_dispatch:

jobs:
  exact-paired-turn-order:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate paired first-draw opportunity and depletion
        run: python -m results.shadow_rider_turn_order_launch.reproduce
