name: Validate Dream Ball typed Bench execution

on:
  push:
    paths:
      - "tools/dream_ball_typed_bench_execution.py"
      - "tools/pokemon_board_metadata.py"
      - "tools/card_search_target_index.py"
      - "tools/build_expanded_legality_baseline.py"
      - "tools/before_hand_prize_executor.py"
      - "tools/before_hand_prize_profiles.py"
      - "tools/search_zone_transition.py"
      - "tools/typed_search_target_allocator.py"
      - "tools/identity_materialization.py"
      - "tools/promotion_pending_conservation.py"
      - "tools/board_position_state.py"
      - "results/dream_ball_typed_bench_execution/**"
      - ".github/workflows/validate-dream-ball-typed-bench-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Dream Ball typed Bench execution
        run: python results/dream_ball_typed_bench_execution/reproduce.py
