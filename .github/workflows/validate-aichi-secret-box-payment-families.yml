name: Validate Aichi Secret Box payment families

on:
  push:
    paths:
      - "tools/aichi_secret_box_payment_families.py"
      - "results/aichi_secret_box_payment_families/**"
      - ".github/workflows/validate-aichi-secret-box-payment-families.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce exact payment families
        env:
          PYTHONPATH: tools
        run: python results/aichi_secret_box_payment_families/reproduce.py
