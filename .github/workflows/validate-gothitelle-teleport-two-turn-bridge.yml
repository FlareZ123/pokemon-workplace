name: Validate Gothitelle two-turn Teleport bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/gothitelle_teleport_two_turn_bridge.py"
      - "results/gothitelle_teleport_two_turn_bridge/**"
      - ".github/workflows/validate-gothitelle-teleport-two-turn-bridge.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate exact cross-turn Stadium payload
        run: python results/gothitelle_teleport_two_turn_bridge/reproduce.py
