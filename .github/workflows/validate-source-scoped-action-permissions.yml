name: Validate source-scoped action permissions

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/active_source_scoped_restrictions.py"
      - "tools/active_source_trainer_transaction.py"
      - "tools/attack_restriction_turn_windows.py"
      - "tools/attack_source_scoped_restrictions.py"
      - "tools/board_derived_action_permissions.py"
      - "tools/board_derived_continuous_restrictions.py"
      - "tools/board_derived_trainer_transaction.py"
      - "tools/card_action_metadata.py"
      - "tools/continuous_source_scoped_restrictions.py"
      - "tools/source_scoped_action_restrictions.py"
      - "tools/source_scoped_channel_projection.py"
      - "tools/source_scoped_restriction_activation.py"
      - "tools/source_scoped_trainer_transaction.py"
      - "results/active_source_scoped_restrictions/**"
      - "results/active_source_trainer_transaction/**"
      - "results/attack_restriction_turn_windows/**"
      - "results/attack_source_scoped_restrictions/**"
      - "results/board_derived_action_permissions/**"
      - "results/board_derived_continuous_restrictions/**"
      - "results/board_derived_trainer_transaction/**"
      - "results/continuous_source_scoped_restrictions/**"
      - "results/source_scoped_action_restrictions/**"
      - "results/source_scoped_channel_projection/**"
      - "results/source_scoped_restriction_activation/**"
      - "results/source_scoped_trainer_transaction/**"
      - ".github/workflows/validate-source-scoped-action-permissions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce source-scoped restriction audit
        run: python results/source_scoped_action_restrictions/reproduce.py
      - name: Reproduce safe PlayerChannels projection
        run: python results/source_scoped_channel_projection/reproduce.py
      - name: Reproduce source-scoped Trainer transaction gating
        run: python results/source_scoped_trainer_transaction/reproduce.py
      - name: Reproduce source-scoped activation geometry
        run: python results/source_scoped_restriction_activation/reproduce.py
      - name: Reproduce continuous restriction evaluation
        run: python results/continuous_source_scoped_restrictions/reproduce.py
      - name: Reproduce board-derived typed action permissions
        run: python results/board_derived_action_permissions/reproduce.py
      - name: Reproduce board-derived continuous restriction evaluation
        run: python results/board_derived_continuous_restrictions/reproduce.py
      - name: Reproduce board-derived Trainer transaction gating
        run: python results/board_derived_trainer_transaction/reproduce.py
      - name: Reproduce attack restriction materialization
        run: python results/attack_source_scoped_restrictions/reproduce.py
      - name: Reproduce attack restriction turn windows
        run: python results/attack_restriction_turn_windows/reproduce.py
      - name: Reproduce active restriction aggregation
        run: python results/active_source_scoped_restrictions/reproduce.py
      - name: Reproduce live-source Trainer transaction gating
        run: python results/active_source_trainer_transaction/reproduce.py
