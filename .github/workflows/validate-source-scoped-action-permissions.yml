name: Validate source-scoped action permissions

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/card_action_metadata.py"
      - "tools/source_scoped_action_restrictions.py"
      - "tools/source_scoped_channel_projection.py"
      - "tools/source_scoped_restriction_activation.py"
      - "tools/source_scoped_trainer_transaction.py"
      - "results/source_scoped_action_restrictions/**"
      - "results/source_scoped_channel_projection/**"
      - "results/source_scoped_restriction_activation/**"
      - "results/source_scoped_trainer_transaction/**"
      - ".github/workflows/validate-source-scoped-action-permissions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce source-scoped restriction audit
        run: python results/source_scoped_action_restrictions/reproduce.py
      - name: Reproduce safe PlayerChannels projection
        run: python results/source_scoped_channel_projection/reproduce.py
      - name: Reproduce source-scoped Trainer transaction gating
        run: python results/source_scoped_trainer_transaction/reproduce.py
      - name: Reproduce source-scoped activation geometry
        run: python results/source_scoped_restriction_activation/reproduce.py
