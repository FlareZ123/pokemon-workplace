name: Validate Aichi Secret Box opaque Pareto frontier

on:
  push:
    paths:
      - "tools/aichi_secret_box_opaque_pareto.py"
      - "results/aichi_secret_box_opaque_pareto/**"
      - ".github/workflows/validate-aichi-secret-box-opaque-pareto.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce opaque Pareto frontier
        env:
          PYTHONPATH: tools
        run: python results/aichi_secret_box_opaque_pareto/reproduce.py
