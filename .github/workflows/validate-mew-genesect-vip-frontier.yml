name: Validate Mew Genesect VIP frontier

on:
  push:
    paths:
      - "results/mew_genesect_vip_opening/**"
      - "results/competitive_deck_baselines/mew_genesect_reproduce.py"
      - ".github/workflows/validate-mew-genesect-vip-frontier.yml"
  pull_request:
    paths:
      - "results/mew_genesect_vip_opening/**"
      - "results/competitive_deck_baselines/mew_genesect_reproduce.py"
      - ".github/workflows/validate-mew-genesect-vip-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-opening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify rational frontier, physical oracle, and print legality
        run: python -m results.mew_genesect_vip_opening.reproduce
      - name: Verify paid Quick Ball and Ultra Ball frontier with labeled oracle
        run: python -m results.mew_genesect_vip_opening.paid_ball_frontier
      - name: Verify Trainers Mail VIP top-four bridge and physical oracle
        run: python -m results.mew_genesect_vip_opening.trainers_mail_vip_bridge
      - name: Verify joint Ball-first Mail VIP policy and labeled cards
        run: python -m results.mew_genesect_vip_opening.combined_mail_ball_frontier
      - name: Verify Special Red Card late natural-access tradeoff
        run: python -m results.mew_genesect_vip_opening.special_red_access_frontier
      - name: Verify paper Expanded slot-cut candidates and physical policy
        run: python -m results.mew_genesect_vip_opening.vip_slot_cut_frontier
      - name: Verify Mew VMAX Ultra access tradeoff with physical Prize oracle
        run: python -m results.mew_genesect_vip_opening.mew_vmax_ultra_frontier
