name: Validate Mew Genesect VIP frontier

on:
  push:
    paths:
      - "results/mew_genesect_vip_opening/**"
      - "results/competitive_deck_baselines/mew_genesect_reproduce.py"
      - ".github/workflows/validate-mew-genesect-vip-frontier.yml"
  pull_request:
    paths:
      - "results/mew_genesect_vip_opening/**"
      - "results/competitive_deck_baselines/mew_genesect_reproduce.py"
      - ".github/workflows/validate-mew-genesect-vip-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-opening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify rational frontier, physical oracle, and print legality
        run: python -m results.mew_genesect_vip_opening.reproduce
      - name: Verify paid Quick Ball and Ultra Ball frontier with labeled oracle
        run: python -m results.mew_genesect_vip_opening.paid_ball_frontier
