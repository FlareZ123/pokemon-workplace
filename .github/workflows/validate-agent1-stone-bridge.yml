name: Validate Aichi Mega Absol Stone bridge

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce existing named-Item physical frontier
        run: python -m results.absol_garbodor_named_item_frontier.reproduce
      - name: Reproduce Crobat Forest Seal Stone bridge and physical oracles
        run: python -m results.absol_garbodor_stone_bridge.reproduce
      - name: Reproduce Dark Asset hand-trigger and payment frontier
        run: python -m results.absol_garbodor_darkasset_frontier.reproduce
      - name: Reproduce Lumineon V and Tapu Lele Supporter physical access
        run: python -m results.absol_lumineon_supporter_frontier.reproduce
