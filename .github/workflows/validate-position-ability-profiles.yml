name: Validate position Ability profiles

on:
  push:
    paths:
      - "tools/position_ability_profiles.py"
      - "tools/dream_ball_evolution_ability_catalog.py"
      - "results/position_ability_profiles/**"
      - ".github/workflows/validate-position-ability-profiles.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/position_ability_profiles/reproduce.py
