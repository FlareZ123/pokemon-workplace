name: Validate pre-Nest information witness classes

on:
  workflow_dispatch:
  push:
    paths:
      - "results/secret_box_pre_nest_witness_classes/**"
      - "tools/secret_box_pre_nest_information.py"
      - ".github/workflows/validate-secret-box-pre-nest-witness-classes.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/secret_box_pre_nest_witness_classes/reproduce.py
