name: Aichi source field (manual)
on:
  workflow_dispatch:

jobs:
  validate-source-field:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install source-parser dependencies
        run: python -m pip install beautifulsoup4 filelock
      - name: Run isolated parser unit tests
        run: python tools/test_aichi_top32_source.py
      - name: Fetch and validate 2026 Aichi field
        run: python tools/aichi_top32_source.py --output aichi_top32_source.json
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-top32-source-field
          path: aichi_top32_source.json
          if-no-files-found: error
