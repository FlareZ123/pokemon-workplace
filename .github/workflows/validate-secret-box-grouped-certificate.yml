name: Validate Secret Box grouped physical certificate

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/grouped_cross_product_certificate.py"
      - ".github/workflows/validate-secret-box-grouped-certificate.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/grouped_cross_product_certificate.py
