name: Validate Serena Discard Capability

on:
  push:
    paths:
      - 'tools/serena_draw_option.py'
      - 'results/serena_discard_capability/**'
      - '.github/workflows/validate-serena-discard-capability.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python results/serena_discard_capability/reproduce.py
