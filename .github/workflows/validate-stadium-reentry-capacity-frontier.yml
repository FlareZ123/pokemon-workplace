name: Validate Stadium reentry capacity frontier

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/stadium_reentry_capacity_frontier.py"
      - "tools/stadium_reentry_usage_bounds.py"
      - "results/stadium_reentry_capacity_frontier/**"
      - ".github/workflows/validate-stadium-reentry-capacity-frontier.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Stadium target capacity frontier
        run: python results/stadium_reentry_capacity_frontier/reproduce.py
