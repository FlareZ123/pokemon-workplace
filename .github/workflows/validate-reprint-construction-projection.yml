name: validate reprint construction projection

on:
  push:
    paths:
      - "tools/reprint_construction_projection.py"
      - "tools/reprint_errata_resolution.py"
      - "results/reprint_construction_projection/**"
      - ".github/workflows/validate-reprint-construction-projection.yml"
  pull_request:
    paths:
      - "tools/reprint_construction_projection.py"
      - "tools/reprint_errata_resolution.py"
      - "results/reprint_construction_projection/**"
      - ".github/workflows/validate-reprint-construction-projection.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m results.reprint_construction_projection.reproduce
