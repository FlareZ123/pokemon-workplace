name: Validate joint Item DCI policy frontier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate nested discard policies and independent physical oracles
        run: python results/joint_discard_policy_frontier/reproduce.py
