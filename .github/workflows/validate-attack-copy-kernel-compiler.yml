name: Validate attack-copy kernel compiler

on:
  push:
    paths:
      - "tools/attack_copy_kernel_compiler.py"
      - "tools/attack_copy_outer_control.py"
      - "tools/attack_copy_contracts.py"
      - "tools/attack_copy_catalog.py"
      - "tools/attack_copy_execution_phases.py"
      - "tools/attack_copy_kernel.py"
      - "results/attack_copy_kernel_compiler/**"
      - ".github/workflows/validate-attack-copy-kernel-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check card-grounded copy lowering
        run: python results/attack_copy_kernel_compiler/reproduce.py
