name: Validate shoes-free Arc Phone Peonia

on:
  push:
    paths:
      - "tools/arc_peonia_shoes_free.py"
      - "tools/arc_peonia_shoes_comparison.py"
      - "tools/arc_peonia_k0_shoes.py"
      - "tools/arc_peonia_mixed_prior.py"
      - "tools/arc_peonia_mask_substitution.py"
      - "results/arc_peonia_shoes_free/**"
      - "results/arc_peonia_shoes_tradeoff/**"
      - "results/arc_peonia_k0_item_frontier/**"
      - "results/arc_peonia_mixed_prior/**"
      - "results/arc_peonia_mask_substitution/**"
      - "resources/cards/en/swsh11.json"
      - "resources/cards/en/swsh6.json"
      - ".github/workflows/validate-arc-peonia-shoes-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify exact policy and access frontier
        run: python results/arc_peonia_shoes_free/reproduce.py
      - name: Verify 150 Arc and Shoes substitution states
        run: python tools/arc_peonia_shoes_comparison.py
      - name: Verify 1225 K0 adaptive policy states
        run: python tools/arc_peonia_k0_shoes.py
      - name: Verify 125 mixed-prior rational policies
        run: python tools/arc_peonia_mixed_prior.py
      - name: Verify matched-access-mask substitution
        run: python tools/arc_peonia_mask_substitution.py
