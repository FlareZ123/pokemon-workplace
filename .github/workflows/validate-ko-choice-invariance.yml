name: Validate KO choice invariance certificates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ko_choice_invariance.py"
      - "tools/ko_source_scoped_choice.py"
      - "tools/ko_order_zone_signature.py"
      - "results/ko_choice_invariance/**"
      - ".github/workflows/validate-ko-choice-invariance.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/ko_choice_invariance/reproduce.py
