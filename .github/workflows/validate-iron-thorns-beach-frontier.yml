name: validate Iron Thorns English Beach alternative

on:
  push:
    paths:
      - "results/decks/iron_thorns_aichi_beach/**"
      - "results/decks/iron_thorns_aichi_english/**"
      - "tools/iron_thorns_beach_frontier.py"
      - "tools/iron_thorns_gnh_discard_gate.py"
      - "tools/deck_legality_proof.py"
      - ".github/workflows/validate-iron-thorns-beach-frontier.yml"
  workflow_dispatch:

jobs:
  exact-printed-deck-and-frontier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m results.decks.iron_thorns_aichi_beach.reproduce
      - run: python -m results.decks.iron_thorns_aichi_beach.frontier_reproduce
