name: validate Shadow Rider Radiant launch

on:
  push:
    paths:
      - "results/shadow_rider_radiant_launch/**"
      - "results/competitive_deck_baselines/shadow_rider_reproduce.py"
      - ".github/workflows/validate-shadow-rider-radiant-launch.yml"
  pull_request:
    paths:
      - "results/shadow_rider_radiant_launch/**"
      - "results/competitive_deck_baselines/shadow_rider_reproduce.py"
      - ".github/workflows/validate-shadow-rider-radiant-launch.yml"
  workflow_dispatch:

jobs:
  exact-radiant-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact launch probabilities and physical oracle
        run: python -m results.shadow_rider_radiant_launch.reproduce
