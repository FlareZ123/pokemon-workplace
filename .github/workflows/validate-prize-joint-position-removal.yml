name: Validate joint Prize position removal

on:
  push:
    paths:
      - "tools/prize_joint_position_removal.py"
      - "tools/observer_top_prize_beliefs.py"
      - "tools/prize_top_swap_belief.py"
      - "results/prize_joint_position_removal/**"
      - ".github/workflows/validate-prize-joint-position-removal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check observer-relative Prize removal
        run: python results/prize_joint_position_removal/reproduce.py
