name: Validate physical deck search target signal

on:
  push:
    paths:
      - "tools/deck_search_target_signal_physical.py"
      - "tools/deck_search_target_signal.py"
      - "tools/deck_search_shuffle_physical_belief.py"
      - "tools/deck_search_shuffle_belief.py"
      - "tools/deck_search_shuffle_topology.py"
      - "tools/top_prize_physical_bridge.py"
      - "tools/identity_materialization.py"
      - "tools/observer_top_prize_beliefs.py"
      - "tools/prize_top_swap_belief.py"
      - "tools/prize_slot_visibility.py"
      - "tools/prize_position_belief.py"
      - "results/deck_search_target_signal_physical/**"
      - ".github/workflows/validate-deck-search-target-signal-physical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check physical revealed-search signaling
        run: python results/deck_search_target_signal_physical/reproduce.py
