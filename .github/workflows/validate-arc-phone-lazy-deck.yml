name: Validate exchangeable Arc Phone deck tail

on:
  push:
    paths:
      - tools/arc_phone_lazy_deck.py
      - results/arc_phone_lazy_deck/**
      - .github/workflows/validate-arc-phone-lazy-deck.yml
  workflow_dispatch:

jobs:
  lazy-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m results.arc_phone_lazy_deck.reproduce
