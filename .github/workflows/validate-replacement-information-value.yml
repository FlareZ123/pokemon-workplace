name: Validate replacement information value

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/replacement_information_value.py"
      - "results/replacement_information_value/**"
      - ".github/workflows/validate-replacement-information-value.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce replacement information value
        run: python results/replacement_information_value/reproduce.py
