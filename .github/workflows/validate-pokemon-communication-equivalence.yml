name: Validate Pokemon Communication equivalence

on:
  push:
    paths:
      - "tools/pokemon_communication_equivalence.py"
      - "results/pokemon_communication_equivalence/**"
      - ".github/workflows/validate-pokemon-communication-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check 54 return-search-shuffle states
        run: python -m results.pokemon_communication_equivalence.reproduce
