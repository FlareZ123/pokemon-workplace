name: Validate Guzma Forced-Pivot Tactical Frontier

on:
  push:
    paths:
      - 'tools/guzma_forced_pivot.py'
      - 'results/tests/guzma_forced_pivot_frontier/**'
      - 'resources/cards/en/sm3.json'
      - 'resources/cards/en/swsh2.json'
      - 'resources/cards/en/sv1.json'
      - '.github/workflows/validate-guzma-forced-pivot-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m results.tests.guzma_forced_pivot_frontier.reproduce
