name: Validate Shadow Rider Thorns continuation
on:
  workflow_dispatch:

jobs:
  route-partition:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact route partition and suppression timing
        run: python -m results.tests.shadow_rider_thorns_continuation.reproduce
