name: Validate Gust Lock Deadlines

on:
  push:
    paths:
      - 'tools/gust_lock_deadlines.py'
      - 'tools/mixed_gust_prize_minimax.py'
      - 'tools/gust_prize_minimax.py'
      - 'results/gust_lock_deadlines/**'
      - '.github/workflows/validate-gust-lock-deadlines.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.gust_lock_deadlines.reproduce
