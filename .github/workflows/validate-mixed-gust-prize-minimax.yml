name: Validate Mixed Gust Prize Minimax

on:
  push:
    paths:
      - 'tools/mixed_gust_prize_minimax.py'
      - 'tools/gust_prize_minimax.py'
      - 'tools/counter_catcher_prize_timing.py'
      - 'results/mixed_gust_prize_minimax/**'
      - '.github/workflows/validate-mixed-gust-prize-minimax.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python results/mixed_gust_prize_minimax/reproduce.py
