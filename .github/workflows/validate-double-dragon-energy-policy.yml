name: Audit Double Dragon bot-energy policy

on:
  workflow_dispatch:
  push:
    paths:
      - simulation/twinleaf/test-double-dragon-energy-policy.cjs
      - .github/workflows/validate-double-dragon-energy-policy.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: git submodule update --init --depth=1 vendor/twinleafgg
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        id: compiled
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - if: steps.compiled.outputs.cache-hit != 'true'
        working-directory: vendor/twinleafgg/ptcg-server
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - run: node simulation/twinleaf/test-double-dragon-energy-policy.cjs
