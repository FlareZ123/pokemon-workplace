name: Validate direct Bench search execution

on:
  push:
    paths:
      - "tools/direct_bench_search_execution.py"
      - "tools/direct_bench_search_profile_compiler.py"
      - "tools/pokemon_board_metadata.py"
      - "tools/search_zone_transition.py"
      - "tools/typed_search_target_allocator.py"
      - "tools/identity_materialization.py"
      - "tools/stack_knockout_conservation.py"
      - "tools/board_position_state.py"
      - "results/direct_bench_search_execution/**"
      - ".github/workflows/validate-direct-bench-search-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check direct-to-Bench physical execution
        run: python results/direct_bench_search_execution/reproduce.py
