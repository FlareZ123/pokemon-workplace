name: Validate Repeated Top-five Information

on:
  push:
    paths:
      - "tools/repeated_topfive_information.py"
      - "tools/rotom_arc_peonia_incidence.py"
      - "results/repeated_topfive_information/**"
      - ".github/workflows/validate-repeated-topfive-information.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m tools.repeated_topfive_information
