name: Validate Shadow Rider Tool and Item Lock

on:
  push:
    paths:
      - 'tools/shadow_rider_tool_lock.py'
      - 'tools/shadow_rider_guzma_damage.py'
      - 'results/tests/shadow_rider_tool_lock/**'
      - 'resources/cards/en/xy7.json'
      - 'resources/cards/en/xy8.json'
      - 'resources/cards/en/sv6.json'
      - '.github/workflows/validate-shadow-rider-tool-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m results.tests.shadow_rider_tool_lock.reproduce
