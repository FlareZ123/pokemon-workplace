name: Validate Secret Box Prize importance sampling

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/importance_sample_prize_tails.py"
      - "tools/accepted_opening_prize_probabilities.py"
      - ".github/workflows/validate-secret-box-prize-importance.yml"
  workflow_dispatch:

jobs:
  conditional-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/importance_sample_prize_tails.py
