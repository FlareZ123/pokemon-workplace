name: Validate Secret Box relaxed Prize-pair bounds

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/relaxed_prize_pair_lower_bounds.py"
      - ".github/workflows/validate-secret-box-relaxed-prize-pair-bounds.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/relaxed_prize_pair_lower_bounds.py
