name: Validate Gothitelle Quick Nest joint board

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/gothitelle_quick_nest_joint_board.py"
      - "tools/gothitelle_two_quick_joint_board.py"
      - "results/gothitelle_quick_nest_joint_board/**"
      - ".github/workflows/validate-gothitelle-quick-nest-joint-board.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify exact Quick plus Nest search policy
        run: python results/gothitelle_quick_nest_joint_board/reproduce.py
      - name: Recheck shared paid-Quick search kernel
        run: python results/gothitelle_two_quick_joint_board/reproduce.py
