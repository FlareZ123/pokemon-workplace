name: Validate attack-copy selected Energy gate

on:
  push:
    paths:
      - "tools/attack_copy_kernel.py"
      - "tools/attack_copy_turn_boundary_bridge.py"
      - "results/attack_copy_selected_energy_gate/**"
      - ".github/workflows/validate-attack-copy-selected-energy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run selected-Energy copy regression
        run: python results/attack_copy_selected_energy_gate/reproduce.py
