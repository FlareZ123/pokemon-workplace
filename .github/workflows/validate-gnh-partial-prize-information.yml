name: Validate G&H partial Prize observability

on:
  workflow_dispatch:

jobs:
  exact-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify partial-information policy and physical oracle
        run: python -m results.gnh_partial_prize_information.reproduce
