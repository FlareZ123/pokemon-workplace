name: Validate Fog-funded Shadow Rider Item search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate Fog to Energy to Item paid search witnesses
        run: python -m results.shadow_rider_fog_energy_payment.reproduce
