name: Validate continuation-aware discard policy

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/continuation_discard_policy.py"
      - "tools/discard_cost_witness.py"
      - "tools/trainer_search_profile_compiler.py"
      - "tools/typed_search_retrieval.py"
      - "tools/search_zone_transition.py"
      - "tools/trainer_search_transaction.py"
      - "results/continuation_aware_discard_policy/**"
      - ".github/workflows/validate-continuation-aware-discard-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce continuation-aware discard policy
        run: python results/continuation_aware_discard_policy/reproduce.py
