name: Validate Peonia Prized Item Recycling

on:
  push:
    paths:
      - "tools/peonia_timing_policy.py"
      - "results/peonia_prized_item_recycling/**"
      - ".github/workflows/validate-peonia-prized-item-recycling.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m results.peonia_prized_item_recycling.reproduce
