name: Validate next-turn attachment permission

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/next_turn_attachment_window.py"
      - "tools/energy_hand_attachment_events.py"
      - "tools/lock_gated_energy_attachment.py"
      - "results/next_turn_attachment_window/**"
      - ".github/workflows/validate-next-turn-attachment-window.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Dragon's Wish attachment permission
        run: python results/next_turn_attachment_window/reproduce.py
      - name: Reproduce physical and target-locked Energy attachments
        run: python results/next_turn_attachment_window/reproduce_physical.py
