name: Validate Typed Retreat Gust

on:
  push:
    paths:
      - 'tools/typed_retreat_gust.py'
      - 'results/typed_retreat_gust/**'
      - '.github/workflows/validate-typed-retreat-gust.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python results/typed_retreat_gust/reproduce.py
