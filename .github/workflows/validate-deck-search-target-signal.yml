name: Validate deck search target signal

on:
  push:
    paths:
      - "tools/deck_search_target_signal.py"
      - "tools/deck_search_shuffle_belief.py"
      - "tools/observer_top_prize_beliefs.py"
      - "tools/prize_top_swap_belief.py"
      - "tools/prize_slot_visibility.py"
      - "tools/prize_position_belief.py"
      - "results/deck_search_target_signal/**"
      - ".github/workflows/validate-deck-search-target-signal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check revealed search-target signaling
        run: python results/deck_search_target_signal/reproduce.py
