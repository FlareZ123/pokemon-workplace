name: Validate Prize Refill Gust

on:
  push:
    paths:
      - 'tools/prize_refill_gust.py'
      - 'tools/stochastic_gust_draw.py'
      - 'results/prize_refill_gust/**'
      - '.github/workflows/validate-prize-refill-gust.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python results/prize_refill_gust/reproduce.py
