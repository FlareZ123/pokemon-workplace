name: Validate direct Bench search profile compiler

on:
  push:
    paths:
      - "tools/direct_bench_search_profile_compiler.py"
      - "tools/build_expanded_legality_baseline.py"
      - "tools/trainer_search_profile_compiler.py"
      - "resources/cards/**"
      - "resources/sets/**"
      - "results/direct_bench_search_profile_compiler/**"
      - ".github/workflows/validate-direct-bench-search-profile-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check direct-to-Bench Basic Pokemon search compiler
        run: python results/direct_bench_search_profile_compiler/reproduce.py
