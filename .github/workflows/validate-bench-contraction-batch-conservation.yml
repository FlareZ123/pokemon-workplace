name: Validate chosen Bench contraction conservation

on:
  push:
    paths:
      - tools/bench_contraction_batch_conservation.py
      - .github/workflows/validate-bench-contraction-batch-conservation.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify physical batch conservation
        run: python tools/bench_contraction_batch_conservation.py --self-test
      - name: Inspect chosen discard witness
        run: python tools/bench_contraction_batch_conservation.py
