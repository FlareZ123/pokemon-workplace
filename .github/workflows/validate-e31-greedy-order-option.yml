name: Validate E-31 Greedy ordering option

on:
  push:
    paths:
      - 'tools/e31_greedy_order_option.py'
      - 'tools/e31_greedy_order_physical.py'
      - 'tools/e31_peonia_seed_execution.py'
      - 'tools/e31_peonia_observer_bridge.py'
      - 'results/e31_greedy_order_option/**'
      - '.github/workflows/validate-e31-greedy-order-option.yml'
  workflow_dispatch:

jobs:
  exact-enumeration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact executable and independent regression entrypoint
        run: |
          python tools/e31_greedy_order_option.py
          python results/e31_greedy_order_option/reproduce.py
          python tools/e31_greedy_order_physical.py
          python tools/e31_peonia_seed_execution.py
          python tools/e31_peonia_observer_bridge.py
