name: Validate Aichi Secret Box K0 policy

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/aichi_secret_box_k0_policy.py"
      - "results/aichi_secret_box_k0_policy/**"
      - ".github/workflows/validate-aichi-secret-box-k0-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Audit belief-constrained Secret Box payment
        run: python results/aichi_secret_box_k0_policy/reproduce.py
