name: Expanded legality regressions

on:
  # Manual-only under repository CI budget rule.
  workflow_dispatch:

jobs:
  legality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deck validator regressions
        run: python results/deck_validator/reproduce.py
      - name: Run set-fallback audit regressions
        run: python results/set_fallback_legality_audit/reproduce.py
      - name: Run reprint candidate regressions
        run: python results/reprint_equivalence_candidates/reproduce.py
      - name: Run errata-aware reprint regressions
        run: python results/errata_reprint_candidates/reproduce.py
