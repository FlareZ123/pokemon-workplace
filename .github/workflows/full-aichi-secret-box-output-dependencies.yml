name: Full Aichi Secret Box output dependency audit

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/aichi_secret_box_output_dependencies/reproduce_full.py
