name: Validate Stadium entry channels

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/stadium_entry_channels.py"
      - "results/stadium_entry_channels/**"
      - ".github/workflows/validate-stadium-entry-channels.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Stadium entry channels
        run: python results/stadium_entry_channels/reproduce.py
