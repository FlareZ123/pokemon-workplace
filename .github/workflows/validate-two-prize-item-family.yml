name: Verify two-key Prize Item family

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/two_prize_item_family.py"
      - ".github/workflows/validate-two-prize-item-family.yml"
  workflow_dispatch:

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/two_prize_item_family.py
