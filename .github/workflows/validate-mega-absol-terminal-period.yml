name: Validate Mega Absol Terminal Period research hook

on:
  workflow_dispatch:
  push:
    paths:
      - simulation/twinleaf/hooks/mega-absol-terminal-period.cjs
      - simulation/twinleaf/test-mega-absol-terminal-period.cjs
      - simulation/twinleaf/test-mega-absol-parasol.cjs
      - .github/workflows/validate-mega-absol-terminal-period.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize exact pinned engine
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install compiled engine requirements
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        id: compiled
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Build if absent
        if: steps.compiled.outputs.cache-hit != 'true'
        working-directory: vendor/twinleafgg/ptcg-server
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - name: Assert Mega Absol exact conditional Knock Out
        run: node simulation/twinleaf/test-mega-absol-terminal-period.cjs
      - name: Assert Big Parasol prevention
        run: node simulation/twinleaf/test-mega-absol-parasol.cjs
