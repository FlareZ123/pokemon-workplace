name: Validate Aichi discard robustness
on:
  push:
    paths:
      - tools/aichi_discard_family_robustness.py
      - .github/workflows/validate-aichi-discard-family-robustness.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/aichi_discard_family_robustness.py
