name: Validate Shadow Rider Fog-to-Marshadow correction
on:
  workflow_dispatch:

jobs:
  exact-fog-marshadow:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cards, labeled physical oracle, and 15 exact scenarios
        run: python -m results.tests.shadow_rider_fog_marshadow.reproduce
