name: Validate agent2 Raichu Dark Asset follow-up

on:
  push:
    paths:
      - "tools/raichu_prize_access.py"
      - "tools/raichu_dark_asset_followup.py"
      - "results/raichu_dark_asset_followup/**"
      - ".github/workflows/validate-agent2-raichu-dark-asset-followup.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded Dark Asset follow-up regressions
        run: PYTHONPATH=tools python results/raichu_dark_asset_followup/reproduce.py
