name: Validate Raichu reset-cancel option

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/raichu_draw_engine_fallback.py"
      - "tools/raichu_reset_cancel_option.py"
      - "results/raichu_reset_cancel_option/**"
      - ".github/workflows/validate-raichu-reset-cancel-option.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned NumPy
        run: python -m pip install numpy==2.3.5
      - name: Validate Raichu reset-cancel option
        run: python results/raichu_reset_cancel_option/reproduce.py
