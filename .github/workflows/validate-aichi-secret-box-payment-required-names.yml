name: Validate Aichi Secret Box required payment names

on:
  push:
    paths:
      - "tools/aichi_secret_box_payment_required_names.py"
      - "results/aichi_secret_box_payment_required_names/**"
      - ".github/workflows/validate-aichi-secret-box-payment-required-names.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce required-name audit
        env:
          PYTHONPATH: tools
        run: python results/aichi_secret_box_payment_required_names/reproduce.py
