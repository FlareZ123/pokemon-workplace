name: Twinleaf matchup evidence integrity

on:
  # Manual-only: the repository owner prohibits per-commit workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twinleaf-evidence-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Check seat attributions and true draws
        run: node simulation/twinleaf/test-paired-result-summary.cjs
      - name: Check conservative seat-paired score bounds
        run: node simulation/twinleaf/test-paired-score-bounds.cjs
      - name: Refuse incompatible evidence and repeated seeds
        run: node simulation/twinleaf/test-matchup-evidence-ledger.cjs
      - name: Validate box-constrained opponent-field bounds against exhaustive oracle
        run: node tools/test-uncertain-metagame-field.cjs
      - name: Reproduce Aichi top-32 proxy composition and coverage
        run: node results/tests/aichi_2026_top32_proxy/reproduce.cjs
      - name: Check lock-guarded atomic artifact writer
        run: node simulation/twinleaf/test-report-atomic.cjs
