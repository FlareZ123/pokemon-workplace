name: Validate competing connector deadlines

on:
  push:
    paths:
      - "tools/competing_connector_policy.py"
      - "tools/competing_connector_deadlines.py"
      - "results/competing_connector_deadlines/**"
      - ".github/workflows/validate-competing-connector-deadlines.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check competing connector deadline allocation
        run: python results/competing_connector_deadlines/reproduce.py
