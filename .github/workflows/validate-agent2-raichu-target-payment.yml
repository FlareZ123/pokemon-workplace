name: Validate Harto Raichu target payment frontier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce target access and physical Prize oracle
        run: python results/raichu_target_payment_frontier/reproduce.py
