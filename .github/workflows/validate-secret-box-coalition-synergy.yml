name: Validate Secret Box coalition synergy

on:
  push:
    paths:
      - "results/secret_box_coalition_synergy/**"
      - "results/aichi_secret_box_output_dependencies/reproduce_full.py"
      - "tools/secret_box_coalition_synergy.py"
      - "tools/subset_shapley.py"
      - ".github/workflows/validate-secret-box-coalition-synergy.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/secret_box_coalition_synergy/reproduce.py
      - run: python results/secret_box_coalition_synergy/trace_pair_witnesses.py
      - run: python results/secret_box_coalition_synergy/antichain_trace.py
      - run: python results/secret_box_coalition_synergy/correlation_bounds.py
      - run: python results/secret_box_coalition_synergy/trace_jet_output_equivalence.py
      - run: python results/secret_box_coalition_synergy/correlation_extrema.py
      - run: python results/secret_box_coalition_synergy/global_portfolio.py
      - run: python results/secret_box_coalition_synergy/constructive_global_witnesses.py
      - run: python results/secret_box_coalition_synergy/exact_prize_tail_validation.py
