name: Validate deck search shuffle belief

on:
  push:
    paths:
      - "tools/deck_search_shuffle_belief.py"
      - "tools/observer_top_prize_beliefs.py"
      - "tools/prize_top_swap_belief.py"
      - "tools/prize_slot_visibility.py"
      - "tools/prize_position_belief.py"
      - "results/deck_search_shuffle_belief/**"
      - ".github/workflows/validate-deck-search-shuffle-belief.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check deck-search/shuffle hidden-state belief
        run: python results/deck_search_shuffle_belief/reproduce.py
