name: validate release legality

on:
  push:
    paths:
      - "tools/release_legality.py"
      - "results/release_legality/**"
      - ".github/workflows/validate-release-legality.yml"
  pull_request:
    paths:
      - "tools/release_legality.py"
      - "results/release_legality/**"
      - ".github/workflows/validate-release-legality.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/release_legality/reproduce.py
