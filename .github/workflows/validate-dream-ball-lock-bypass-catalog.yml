name: Validate Dream Ball lock-bypass catalog

on:
  push:
    paths:
      - "tools/dream_ball_lock_bypass_catalog.py"
      - "tools/dream_ball_evolution_ability_catalog.py"
      - "tools/lock_effect_catalog.py"
      - "tools/build_expanded_legality_baseline.py"
      - "results/dream_ball_lock_bypass_catalog/**"
      - ".github/workflows/validate-dream-ball-lock-bypass-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Dream Ball lock-bypass catalog
        run: python results/dream_ball_lock_bypass_catalog/reproduce.py
