name: Validate pre-reset search dominance

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/pre_reset_search_dominance.py"
      - "results/pre_reset_search_dominance/**"
      - ".github/workflows/validate-pre-reset-search-dominance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate search-before-reset dominance
        run: python results/pre_reset_search_dominance/reproduce.py
