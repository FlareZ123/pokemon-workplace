name: Validate Prize pending take

on:
  push:
    paths:
      - "tools/prize_pending_take.py"
      - "tools/prize_joint_position_removal.py"
      - "tools/top_prize_physical_bridge.py"
      - "tools/identity_materialization.py"
      - "results/prize_pending_take/**"
      - ".github/workflows/validate-prize-pending-take.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Prize pending timing
        run: python results/prize_pending_take/reproduce.py
