name: Validate Grand Tree target Basic conditioning

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/grand_tree_target_basic_conditioning.py"
      - "tools/grand_tree_initial_zone_probability.py"
      - "results/grand_tree_target_basic_conditioning/**"
      - ".github/workflows/validate-grand-tree-target-basic-conditioning.yml"
  pull_request:
    paths:
      - "tools/grand_tree_target_basic_conditioning.py"
      - "tools/grand_tree_initial_zone_probability.py"
      - "results/grand_tree_target_basic_conditioning/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/grand_tree_target_basic_conditioning/reproduce.py
