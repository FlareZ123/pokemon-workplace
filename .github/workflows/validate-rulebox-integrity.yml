name: Validate Pokémon Rule Box integrity

on:
  push:
    paths:
      - "tools/rulebox_integrity_audit.py"
      - "tools/verified_card_metadata.py"
      - "resources/cards/en/**"
      - "results/rulebox_integrity_guard/**"
      - ".github/workflows/validate-rulebox-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify six Pokémon Rule Box categories
        run: python -m results.rulebox_integrity_guard.reproduce
      - name: Cross-check audited print correction boundary
        run: python -m results.verified_card_metadata_boundary.reproduce
