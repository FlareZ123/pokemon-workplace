name: Validate agent2 Raichu belief-weighted discard

on:
  workflow_dispatch:
  push:
    paths:
      - "results/raichu_belief_weighted_discard/**"
      - "tools/belief_weighted_discard_policy.py"
      - "tools/continuation_discard_policy.py"
      - "tools/raichu_search_to_crobat_execution.py"
      - "tools/gladion_supporter_physical_transaction.py"
      - ".github/workflows/validate-agent2-raichu-belief-discard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce belief-weighted Raichu discard policy
        run: python results/raichu_belief_weighted_discard/reproduce.py
