name: Validate discard family
on:
  push:
    paths:
      - tools/discard_feasibility_hypergraph.py
      - .github/workflows/validate-discard-feasibility-hypergraph.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/discard_feasibility_hypergraph.py
