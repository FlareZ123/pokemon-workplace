name: Validate cost-before-search catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/cost_before_search_catalog.py"
      - "results/cost_before_search_catalog/**"
      - ".github/workflows/validate-cost-before-search-catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build cost-before-search catalog
        run: python tools/cost_before_search_catalog.py
