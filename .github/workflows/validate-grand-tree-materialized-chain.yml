name: Validate Grand Tree materialized chain

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/grand_tree_materialized_chain.py"
      - "tools/grand_tree_chain_execution.py"
      - "tools/effect_evolution_source_gate.py"
      - "tools/effect_evolution_execution.py"
      - "tools/identity_materialization.py"
      - "results/grand_tree_materialized_chain/**"
      - ".github/workflows/validate-grand-tree-materialized-chain.yml"
  pull_request:
    paths:
      - "tools/grand_tree_materialized_chain.py"
      - "tools/grand_tree_chain_execution.py"
      - "tools/effect_evolution_source_gate.py"
      - "tools/effect_evolution_execution.py"
      - "tools/identity_materialization.py"
      - "results/grand_tree_materialized_chain/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/grand_tree_materialized_chain/reproduce.py
