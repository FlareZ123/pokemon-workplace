name: Validate Secret Box Basic holder bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/secret_box_k0_bench_bootstrap.py"
      - "tools/secret_box_k0_opening_mix.py"
      - "tools/secret_box_k0_payment.py"
      - "tools/secret_box_gnh_tool_pipeline.py"
      - "results/secret_box_k0_bench_bootstrap/**"
      - ".github/workflows/validate-secret-box-k0-bench-bootstrap.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/secret_box_k0_bench_bootstrap/reproduce.py
