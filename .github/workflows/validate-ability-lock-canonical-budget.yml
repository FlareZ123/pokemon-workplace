name: Validate causal lock canonical budget

on:
  # Manual-only under repository CI budget rule.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce causal lock canonical budget bridge
        run: python results/ability_lock_canonical_budget/reproduce.py
