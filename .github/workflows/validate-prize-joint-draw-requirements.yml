name: Validate Prize joint draw requirements

on:
  push:
    paths:
      - "tools/prize_joint_draw_requirements.py"
      - "tools/prize_prefix_draw_exposure.py"
      - "tools/prize_deck_prefix.py"
      - "results/prize_joint_draw_requirements/**"
      - ".github/workflows/validate-prize-joint-draw-requirements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify dependent multi-resource draw-window probabilities
        run: python results/prize_joint_draw_requirements/reproduce.py
