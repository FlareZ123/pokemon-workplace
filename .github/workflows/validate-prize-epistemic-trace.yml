name: Validate Prize epistemic observation trace

on:
  push:
    paths:
      - "tools/prize_epistemic_trace.py"
      - "tools/prize_position_top_swap.py"
      - "results/prize_epistemic_trace/**"
      - ".github/workflows/validate-prize-epistemic-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check event-derived actor information partitions
        run: python results/prize_epistemic_trace/reproduce.py
