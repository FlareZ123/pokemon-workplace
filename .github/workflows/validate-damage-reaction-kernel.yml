name: Validate damage reaction kernel

on:
  push:
    paths:
      - "tools/damage_reaction_kernel.py"
      - "tools/damage_board_bridge.py"
      - "tools/damage_calculation_kernel.py"
      - "results/damage_reaction_kernel/**"
      - "resources/cards/en/sv9.json"
      - "resources/cards/en/sv10.json"
      - "resources/cards/en/sv7.json"
      - ".github/workflows/validate-damage-reaction-kernel.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/damage_reaction_kernel/reproduce.py
