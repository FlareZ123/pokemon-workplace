name: Validate Aichi Shadow Rider Quick Ball extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check exact legal list, access fractions and physical toy oracles
        run: python -m results.shadow_rider_quick_ball_frontier.reproduce
