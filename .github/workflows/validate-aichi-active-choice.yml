name: Validate Aichi Active choice
on:
  push:
    paths:
      - tools/aichi_active_choice.py
      - tools/aichi_active_invariance.py
      - results/aichi_active_choice/reproduce.py
      - .github/workflows/validate-aichi-active-choice.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/aichi_active_choice.py
      - run: python tools/aichi_active_invariance.py
