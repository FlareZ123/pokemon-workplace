name: Validate pre-Nest Ball density

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/secret_box_pre_nest_density.py"
      - "tools/secret_box_pre_nest_opening_mix.py"
      - "tools/secret_box_pre_nest_information.py"
      - "results/secret_box_pre_nest_density/**"
      - ".github/workflows/validate-secret-box-pre-nest-density.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/secret_box_pre_nest_density/reproduce.py
