name: Test observation-blind topdeck Trainer tactic
on:
  push:
    paths:
      - 'simulation/twinleaf/blind-topdeck-trainer-tactic.cjs'
      - 'simulation/twinleaf/test-blind-topdeck-search.cjs'
      - '.github/workflows/validate-twinleaf-blind-topdeck-search.yml'
      - 'simulation/twinleaf/tactic-order-policy.cjs'
      - 'simulation/twinleaf/test-tactic-order-policy.cjs'
      - 'simulation/twinleaf/tournament-bounded-match.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact research commit
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Fetch pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleafgg/ptcg-server
        run: npx tsc --project tsconfig.json
      - name: Verify opt-in mode and exact K0 Item decisions
        run: |
          node simulation/twinleaf/test-tactic-order-policy.cjs
          node simulation/twinleaf/test-tournament-probe-settings.cjs
          node simulation/twinleaf/test-blind-topdeck-search.cjs
      - name: Bounded Aichi policy-integration diagnostic
        env:
          TWINLEAF_TACTIC_ORDER: blind_topdeck
          TWINLEAF_SEEDS: '20261012'
          TWINLEAF_DECK_A: vileplume
          TWINLEAF_DECK_B: mew_genesect
        run: node simulation/twinleaf/tournament-bounded-match.cjs
