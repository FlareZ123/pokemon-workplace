name: Validate Supporter play-event history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/supporter_play_event_history/reproduce.py
      - run: python results/supporter_play_event_history/reproduce_copy_paths.py
