name: Validate Gust Source Incomparability

on:
  push:
    paths:
      - 'tools/gust_source_incomparability.py'
      - 'tools/target_restricted_gust_minimax.py'
      - 'tools/mixed_gust_prize_minimax.py'
      - 'results/gust_source_incomparability/**'
      - '.github/workflows/validate-gust-source-incomparability.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.gust_source_incomparability.reproduce
