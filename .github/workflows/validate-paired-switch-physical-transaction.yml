name: Validate Paired Switch Physical Transaction

on:
  push:
    paths:
      - 'tools/paired_switch_physical_transaction.py'
      - 'tools/paired_switch_order_catalog.py'
      - 'tools/board_object_kernel.py'
      - 'tools/turn_action_budget.py'
      - 'results/paired_switch_physical_transaction/**'
      - '.github/workflows/validate-paired-switch-physical-transaction.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.paired_switch_physical_transaction.reproduce
