name: Validate joint Bench guard history probability

on:
  push:
    paths:
      - tools/bench_guard_joint_posterior.py
      - tools/bench_guard_history_posterior.py
      - tools/bench_intermediate_guard_equivalence.py
      - .github/workflows/validate-bench-guard-joint-posterior.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 128397 joint guard posterior configurations
        run: python tools/bench_guard_joint_posterior.py --self-test
      - name: Print independent-product bias
        run: python tools/bench_guard_joint_posterior.py
