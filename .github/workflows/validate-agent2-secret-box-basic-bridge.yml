name: Validate Secret Box Basic bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate prize-aware typed Ball and Secret Box paths
        run: python results/secret_box_basic_bridge/reproduce.py
