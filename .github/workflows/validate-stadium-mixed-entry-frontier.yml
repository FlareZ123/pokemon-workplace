name: Validate mixed Stadium entry frontier

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/stadium_reentry_usage_bounds.py"
      - "results/stadium_mixed_entry_frontier/**"
      - ".github/workflows/validate-stadium-mixed-entry-frontier.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce mixed Stadium channels
        run: python results/stadium_mixed_entry_frontier/reproduce.py
