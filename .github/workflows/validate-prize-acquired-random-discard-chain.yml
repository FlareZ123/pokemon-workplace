name: Validate sequential random discard evidence

on:
  push:
    paths:
      - 'tools/prize_acquired_random_discard_chain.py'
      - 'results/prize_acquired_random_discard_chain/**'
      - '.github/workflows/validate-prize-acquired-random-discard-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python results/prize_acquired_random_discard_chain/reproduce.py
