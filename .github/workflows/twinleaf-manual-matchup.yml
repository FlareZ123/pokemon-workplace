name: Twinleaf manual paired Aichi matchup

on:
  workflow_dispatch:
    inputs:
      deck_a:
        description: First paper Expanded tournament reference deck
        type: choice
        required: true
        default: shadow_rider
        options:
          - vileplume
          - shadow_rider
          - regidrago
          - mew_genesect
          - mew_genesect_vip4
          - regidrago_dragapult_2
          - absol_garbodor
      deck_b:
        description: Distinct second tournament reference deck
        type: choice
        required: true
        default: regidrago
        options:
          - vileplume
          - shadow_rider
          - regidrago
          - mew_genesect
          - mew_genesect_vip4
          - regidrago_dragapult_2
          - absol_garbodor
      seeds:
        description: One to three distinct unsigned 32-bit seeds, comma-separated
        type: string
        required: true
        default: '20261012'
      tactic_order:
        description: Research comparison of native bot action priority
        type: choice
        required: true
        default: native
        options:
          - native
          - attack_before_retreat
          - vip_first
          - vip_attack_before_retreat
          - blind_paid_search

permissions:
  contents: read

jobs:
  paired-matchup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research revision without broken nested upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - name: Set up pinned Twinleaf Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: vendor/twinleafgg/.nvmrc
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore pinned server compile
        id: compiled
        uses: actions/cache/restore@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Compile pinned server if uncached
        if: steps.compiled.outputs.cache-hit != 'true'
        working-directory: vendor/twinleafgg/ptcg-server
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - name: Cache compiled server
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Verify seat attribution, draws and censored outcomes
        run: node simulation/twinleaf/test-paired-result-summary.cjs
      - name: Verify seat-paired censor bounds and dependence units
        run: node simulation/twinleaf/test-paired-score-bounds.cjs
      - name: Verify cross-run identity, seed uniqueness and model comparability
        run: node simulation/twinleaf/test-matchup-evidence-ledger.cjs
      - name: Verify deck and seed limits
        run: node simulation/twinleaf/test-tournament-probe-settings.cjs
      - name: Verify action telemetry under in-place game-state mutation
        run: node simulation/twinleaf/test-match-action-telemetry.cjs
      - name: Verify research bot tactic reorder and pinned assumptions
        run: node simulation/twinleaf/test-tactic-order-policy.cjs
      - name: Verify first-turn VIP research tactic uses native legal action
        run: node simulation/twinleaf/test-vip-first-tactic.cjs
      - name: Validate exact Mew VIP4 candidate mapping and published 60-card reference
        run: node simulation/twinleaf/test-candidate-deck-loader.cjs
      - name: Check legal Underworld Door target and zero-target rejection
        run: node simulation/twinleaf/test-underworld-door-targets.cjs
      - name: Verify exact first-turn Regidrago Celestial Roar Special Energy exposure
        run: python -m results.tests.twinleaf_regidrago_celestial_roar.natural_first_attack
      - name: Verify published Regidrago 60-card blind-three Special Energy frequency
        run: python -m results.tests.twinleaf_regidrago_celestial_roar.reproduce
      - name: Verify Regidrago Celestial Roar attaches all Energy card types
        run: node simulation/twinleaf/test-regidrago-celestial-roar.cjs
      - name: Verify Regidrago Celestial Roar through native Store and provided Energy
        run: node simulation/twinleaf/test-regidrago-celestial-roar-store.cjs
      - name: Verify Stoutland Wild Tackle source self-damage and coin branches
        run: node simulation/twinleaf/test-stoutland-wild-tackle.cjs
      - name: Verify pinned Mega Absol direct Knock Out hook before Night Watch
        run: node simulation/twinleaf/test-mega-absol-terminal-period.cjs
      - name: Verify Night Watch uses two seeded uniformly random physical hand cards
        run: node simulation/twinleaf/test-night-watch-live-hook.cjs
      - name: Verify Night Watch resolves against the real Twinleaf Store
        run: node simulation/twinleaf/test-night-watch-real-store.cjs
      - name: Verify ten single-card random opponent-hand source guards
        run: node simulation/twinleaf/test-random-hand-single-hook.cjs
      - name: Verify live runner records every verified random-hand guard
        run: node simulation/twinleaf/test-tournament-engine-hooks.cjs
      - name: Verify lock-guarded atomic JSON artifact writer
        run: node simulation/twinleaf/test-report-atomic.cjs
      - name: Probe complete 60-card tournament decks through pinned live engine
        timeout-minutes: 4
        env:
          TWINLEAF_DECK_A: ${{ inputs.deck_a }}
          TWINLEAF_DECK_B: ${{ inputs.deck_b }}
          TWINLEAF_SEEDS: ${{ inputs.seeds }}
          TWINLEAF_TACTIC_ORDER: ${{ inputs.tactic_order }}
          TWINLEAF_REPORT_PATH: tournament-match-report.json
        run: node simulation/twinleaf/tournament-bounded-match.cjs
      - name: Save immutable run manifest and raw paired traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twinleaf-matchup-report
          path: tournament-match-report.json
          if-no-files-found: warn
          retention-days: 30
