name: Validate Low-Prize Escape Dominance

on:
  push:
    paths:
      - 'tools/two_sided_stochastic_escape.py'
      - 'results/low_prize_escape_dominance/**'
      - '.github/workflows/validate-low-prize-escape-dominance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python results/low_prize_escape_dominance/reproduce.py
