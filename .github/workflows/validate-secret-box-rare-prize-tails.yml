name: Validate Secret Box rare Prize tails

on:
  push:
    paths:
      - "results/secret_box_coalition_synergy/rare_tagcall_prize_tail.py"
      - "results/secret_box_coalition_synergy/exact_prize_tail_validation.py"
      - "results/secret_box_global_witnesses/stratum_confidence_intervals.py"
      - "results/secret_box_coalition_synergy/constructive_global_witnesses.py"
      - "tools/accepted_opening_prize_probabilities.py"
      - ".github/workflows/validate-secret-box-rare-prize-tails.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/secret_box_coalition_synergy/rare_tagcall_prize_tail.py
      - run: python results/secret_box_coalition_synergy/exact_prize_tail_validation.py
      - run: python results/secret_box_coalition_synergy/constructive_global_witnesses.py
      - run: python results/secret_box_global_witnesses/stratum_confidence_intervals.py
