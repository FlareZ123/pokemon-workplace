name: Validate sequential search-policy learning

on:
  push:
    paths:
      - "tools/search_policy_session_learning.py"
      - "tools/latent_search_policy_belief.py"
      - "tools/observation_policy_envelope.py"
      - "results/sequential_search_policy_learning/**"
      - ".github/workflows/validate-sequential-search-policy-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check sequential posterior and deferred Prize labels
        run: python results/sequential_search_policy_learning/reproduce.py
