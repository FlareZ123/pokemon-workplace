name: Validate attack-copy research

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-attack-copy-research.yml"
      - "tools/attack_copy_catalog.py"
      - "tools/attack_copy_kernel.py"
      - "tools/attack_copy_composition.py"
      - "tools/copied_attack_partial_resolution.py"
      - "tools/attack_discard_dependency_grammar.py"
      - "tools/apex_dragon_discard_burden.py"
      - "tools/multi_unit_energy_semantics.py"
      - "tools/energy_discard_solver.py"
      - "tools/apex_dragon_special_energy_burden.py"
      - "tools/energy_identity_semantics.py"
      - "tools/attached_energy_cards.py"
      - "results/attack_copy_semantics/**"
      - "results/copied_attack_partial_resolution/**"
      - "results/attack_discard_dependency_grammar/**"
      - "results/apex_dragon_discard_burden/**"
      - "results/multi_unit_energy_semantics/**"
      - "results/apex_dragon_special_energy_burden/**"
      - "results/energy_identity_semantics/**"
      - "results/attached_energy_cards/**"
      - "resources/cards/en/**"
      - "resources/sets/en.json"

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce attack-copy catalog
        run: python results/attack_copy_semantics/reproduce.py
      - name: Reproduce copy-resolution kernel
        run: python results/attack_copy_semantics/reproduce_kernel.py
      - name: Reproduce copy-composition graph
        run: python results/attack_copy_semantics/reproduce_composition.py
      - name: Reproduce copied-attack partial resolution
        run: python results/copied_attack_partial_resolution/reproduce.py
      - name: Reproduce discard dependency grammar
        run: python results/attack_discard_dependency_grammar/reproduce.py
      - name: Reproduce Apex Dragon Basic-Energy burden
        run: python results/apex_dragon_discard_burden/reproduce.py
      - name: Reproduce multi-unit Energy semantics
        run: python results/multi_unit_energy_semantics/reproduce.py
      - name: Reproduce Apex Dragon Special-Energy burden
        run: python results/apex_dragon_special_energy_burden/reproduce.py
      - name: Reproduce Energy identity semantics
        run: python results/energy_identity_semantics/reproduce.py
      - name: Reproduce physical attached-Energy state
        run: python results/attached_energy_cards/reproduce.py
