name: Validate Shadow Rider Prize rescue launch

on:
  push:
    paths:
      - 'tools/shadow_rider_heavy_ball_launch.py'
      - 'results/shadow_rider_heavy_ball_launch/**'
      - 'results/shadow_rider_radiant_launch/reproduce.py'
      - 'results/competitive_deck_baselines/shadow_rider_reproduce.py'
      - '.github/workflows/validate-shadow-rider-heavy-ball-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Exact champion Prize rescue and independent physical oracle
        run: python -m results.shadow_rider_heavy_ball_launch.reproduce
