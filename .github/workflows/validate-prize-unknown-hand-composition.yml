name: Validate unknown Prize-origin hand composition

on:
  push:
    paths:
      - 'tools/prize_unknown_hand_composition.py'
      - 'results/prize_unknown_hand_composition/**'
      - '.github/workflows/validate-prize-unknown-hand-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python results/prize_unknown_hand_composition/reproduce.py
