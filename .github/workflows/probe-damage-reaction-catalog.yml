name: Probe damage reaction catalog

on:
  push:
    paths:
      - "tools/damage_reaction_catalog.py"
      - "results/damage_reaction_catalog/**"
      - ".github/workflows/probe-damage-reaction-catalog.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/damage_reaction_catalog/reproduce.py
