name: Validate pending Prize batch identity belief

on:
  push:
    paths:
      - "tools/pending_prize_batch_identity_belief.py"
      - "tools/observer_top_prize_beliefs.py"
      - "results/pending_prize_batch_identity_belief/**"
      - ".github/workflows/validate-pending-prize-batch-identity-belief.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check pending Prize batch beliefs
        run: python results/pending_prize_batch_identity_belief/reproduce.py
