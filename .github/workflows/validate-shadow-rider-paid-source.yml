name: Validate Shadow Rider paid search allocation
on:
  workflow_dispatch:

jobs:
  exact-paid-source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify physical payments, small-deck oracle and exact full-deck model
        run: python -m results.tests.shadow_rider_paid_search_allocation.reproduce
