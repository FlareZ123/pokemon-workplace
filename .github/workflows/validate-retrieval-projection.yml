name: Validate retrieval projection

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/typed_search_retrieval.py"
      - "tools/typed_search_target_allocator.py"
      - "results/retrieval_projection_equivalence/**"
      - ".github/workflows/validate-retrieval-projection.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/retrieval_projection_equivalence/reproduce.py
