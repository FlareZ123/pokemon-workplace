name: Validate Iron Thorns Speed recovery

on:
  push:
    paths:
      - "tools/iron_thorns_speed_recovery_line.py"
      - "tools/iron_thorns_named_line_probability.py"
      - "tools/aichi_setup_inference.py"
      - "results/iron_thorns_speed_recovery_line/reproduce.py"
      - ".github/workflows/validate-iron-thorns-speed-recovery.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce Speed Lightning recovery line
        run: python results/iron_thorns_speed_recovery_line/reproduce.py
