name: Validate multisource opponent gust race

on:
  push:
    paths:
      - tools/multisource_opponent_gust_race.py
      - tools/mixed_gust_opening_access.py
      - results/multisource_opponent_gust_race/**
      - .github/workflows/validate-multisource-opponent-gust-race.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.multisource_opponent_gust_race.reproduce
