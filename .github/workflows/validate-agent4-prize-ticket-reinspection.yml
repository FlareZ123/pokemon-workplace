name: Validate sequential Prize Ticket reinspection

on:
  push:
    paths:
      - "tools/prize_ticket_reinspection.py"
      - "tools/prize_ticket_natural_access.py"
      - "tools/prize_ticket_policy_access.py"
      - "tools/prize_ticket_shuffle_intervention.py"
      - "tools/prize_ticket_shuffle_blind.py"
      - "results/prize_ticket_reinspection/**"
      - ".github/workflows/validate-agent4-prize-ticket-reinspection.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact Ticket stopping-policy regressions
        run: |
          python results/prize_ticket_reinspection/reproduce.py
          python results/prize_ticket_reinspection/access_reproduce.py
          python results/prize_ticket_reinspection/policy_reproduce.py
          python results/prize_ticket_reinspection/shuffle_reproduce.py
          python results/prize_ticket_reinspection/blind_shuffle_reproduce.py
