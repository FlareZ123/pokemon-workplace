name: Validate Regidrago post-Trifrost recharge

on:
  push:
    paths:
      - tools/regidrago_post_trifrost_recharge.py
      - results/regidrago_post_trifrost_recharge/**
      - results/regidrago_budew_promotion_baselines/aichi9_counts.json
      - .github/workflows/validate-regidrago-post-trifrost-recharge.yml
  workflow_dispatch:

jobs:
  check-energy-sequencing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test conditional Crispin Raihan Legacy Star Energy routes
        run: python3 results/regidrago_post_trifrost_recharge/reproduce.py
