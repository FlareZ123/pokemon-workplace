name: Validate Regidrago post-Trifrost recharge

on:
  push:
    paths:
      - tools/regidrago_post_trifrost_recharge.py
      - tools/aichi_regidrago_crispin_energy_supply.py
      - tools/aichi_regidrago_t1_natural_choice.py
      - tools/aichi_regidrago_crispin_paired_causal.py
      - tools/aichi_regidrago_super_rod_bridge.py
      - tools/aichi_regidrago_super_rod_partition_frontier.py
      - results/tests/aichi_regidrago_super_rod_bridge/**
      - results/tests/aichi_regidrago_crispin_paired_causal/**
      - results/tests/aichi_regidrago_t1_natural_choice/**
      - results/tests/aichi_regidrago_crispin_post_trifrost/**
      - results/regidrago_aichi_top10_playable/yoshioka_regidrago_2026.json
      - results/regidrago_post_trifrost_recharge/**
      - results/regidrago_budew_promotion_baselines/aichi9_counts.json
      - .github/workflows/validate-regidrago-post-trifrost-recharge.yml
  workflow_dispatch:

jobs:
  check-energy-sequencing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test conditional Crispin Raihan Legacy Star Energy routes
        run: python results/regidrago_post_trifrost_recharge/reproduce.py
      - name: Verify complete Basic type partition frontier theorem
        run: python -m results.tests.aichi_regidrago_super_rod_bridge.partition_reproduce
      - name: Verify causal Super Rod Crispin next-turn reversal
        run: python -m results.tests.aichi_regidrago_super_rod_bridge.reproduce
      - name: Verify causal invariance under same-hand Basic attachment
        run: python -m results.tests.aichi_regidrago_crispin_paired_causal.reproduce
      - name: Verify Regidrago natural first-eight Energy choice frequency
        run: python -m results.tests.aichi_regidrago_t1_natural_choice.reproduce
      - name: Verify exact Aichi Crispin Energy supply against physical-card enumeration
        run: python -m results.tests.aichi_regidrago_crispin_post_trifrost.reproduce
