name: Validate Aichi Secret Box opaque discard frontier

on:
  push:
    paths:
      - "tools/aichi_secret_box_opaque_discard_frontier.py"
      - "results/aichi_secret_box_opaque_discard_frontier/**"
      - ".github/workflows/validate-aichi-secret-box-opaque-discard-frontier.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce opaque discard frontier
        env:
          PYTHONPATH: tools
        run: python results/aichi_secret_box_opaque_discard_frontier/reproduce.py
