name: Validate Aichi Secret Box swap

on:
  # Manual-only under repository CI budget rule.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/aichi_vileplume_secret_box/reproduce.py
