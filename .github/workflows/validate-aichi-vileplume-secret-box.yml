name: Validate Aichi Secret Box swap

on:
  push:
    paths:
      - "tools/aichi_vileplume_als.py"
      - "tools/aichi_vileplume_secret_box.py"
      - "results/aichi_vileplume_secret_box/**"
      - ".github/workflows/validate-aichi-vileplume-secret-box.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/aichi_vileplume_secret_box/reproduce.py
