name: Validate physical Retreat action enumeration

on:
  push:
    paths:
      - "tools/retreat_action_enumerator.py"
      - "tools/board_derived_retreat.py"
      - "tools/attached_tool_retreat_modifiers.py"
      - "results/retreat_action_enumeration/**"
      - ".github/workflows/validate-retreat-action-enumeration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Enumerate legal payment and destination branches
        run: |
          python results/retreat_action_enumeration/reproduce.py
          python results/retreat_energy_transaction/reproduce.py
          python results/retreat_prize_provider_uncertainty/reproduce.py
          python results/board_derived_retreat/reproduce.py
