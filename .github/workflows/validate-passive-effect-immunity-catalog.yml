name: Validate passive effect immunity catalog

on:
  push:
    paths:
      - "tools/passive_effect_immunity_catalog.py"
      - "results/passive_effect_immunity_catalog/**"
      - ".github/workflows/validate-passive-effect-immunity-catalog.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/passive_effect_immunity_catalog/reproduce.py
