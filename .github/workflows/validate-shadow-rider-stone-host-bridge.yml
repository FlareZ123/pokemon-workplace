name: Validate Shadow Rider Stone host search bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify exact V search, Tool host and Prize bridge
        run: python -m results.shadow_rider_stone_host_bridge.reproduce
