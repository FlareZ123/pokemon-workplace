name: Verify Mew Wally / Tapu slot frontier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check card legality and exact prize/opening frontier
        run: python results/tests/mew_wally_slot_frontier/reproduce.py
      - name: Compare conditional Path, Item and Ability lock states
        run: python results/tests/mew_wally_slot_frontier/lock_extension.py
      - name: Verify natural Muscle Band 230 damage versus Iron Thorns
        run: python results/tests/mew_wally_slot_frontier/iron_thorns_bridge.py
      - name: Verify Hisuian Heavy Ball Prize rescue bridge
        run: python results/tests/mew_wally_slot_frontier/heavy_ball_prize_bridge.py
      - name: Check competing Heavy Ball Lele/Genesect retrieval
        run: python results/tests/mew_wally_slot_frontier/heavy_ball_joint_policy.py
