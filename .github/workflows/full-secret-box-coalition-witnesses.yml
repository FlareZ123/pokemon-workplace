name: Full Secret Box coalition witnesses

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/secret_box_coalition_synergy/trace_pair_witnesses_full.py
      - run: python results/secret_box_coalition_synergy/antichain_trace_full.py
      - run: python results/secret_box_coalition_synergy/trace_small_pair_witnesses.py
      - run: python results/secret_box_coalition_synergy/trace_jet_output_equivalence_full.py
      - run: python results/secret_box_coalition_synergy/rare_tagcall_prize_tail.py
