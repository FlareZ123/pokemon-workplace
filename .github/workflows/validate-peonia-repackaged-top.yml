name: Validate Peonia Deck-Top Repacking

on:
  push:
    paths:
      - "tools/peonia_timing_policy.py"
      - "results/peonia_repackaged_top/**"
      - ".github/workflows/validate-peonia-repackaged-top.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m results.peonia_repackaged_top.reproduce
