name: Validate Aichi forced singleton discards
on:
  push:
    paths:
      - tools/aichi_active_forced_singletons.py
      - .github/workflows/validate-aichi-active-forced-singletons.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/aichi_active_forced_singletons.py
