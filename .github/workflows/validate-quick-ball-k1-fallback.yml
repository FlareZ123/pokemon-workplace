name: Validate Quick Ball K1 fallback

on:
  push:
    paths:
      - "tools/quick_ball_pre_draw_option.py"
      - "results/quick_ball_pre_draw_option/reproduce.py"
      - "results/quick_ball_k1_fallback/**"
      - ".github/workflows/validate-quick-ball-k1-fallback.yml"
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/quick_ball_k1_fallback/reproduce.py
