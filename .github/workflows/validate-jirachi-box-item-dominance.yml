name: Validate Jirachi Box Item dominance

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/jirachi_box_item_dominance.py"
      - ".github/workflows/validate-jirachi-box-item-dominance.yml"
  workflow_dispatch:

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/jirachi_box_item_dominance.py
