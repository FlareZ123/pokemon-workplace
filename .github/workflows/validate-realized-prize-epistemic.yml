name: Validate realized Prize epistemic synchronization

on:
  push:
    paths:
      - "tools/realized_prize_epistemic.py"
      - "tools/prize_epistemic_trace.py"
      - "tools/observer_positioned_prize_truth.py"
      - "tools/prize_position_top_swap.py"
      - "results/realized_prize_epistemic/**"
      - ".github/workflows/validate-realized-prize-epistemic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check physical-instance and observation-history synchronization
        run: python results/realized_prize_epistemic/reproduce.py
