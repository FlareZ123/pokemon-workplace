name: Validate Regidrago VSTAR Item tutoring frontier

on:
  workflow_dispatch:

jobs:
  physical-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify one-use Item tutor by physical labeled cards
        run: python -m results.decks.regidrago_dragapult_2.vstar_tutoring_reproduce
