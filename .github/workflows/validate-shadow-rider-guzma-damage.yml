name: Validate Shadow Rider Guzma Damage Threshold

on:
  push:
    paths:
      - 'tools/shadow_rider_guzma_damage.py'
      - 'results/tests/shadow_rider_guzma_damage/**'
      - 'resources/cards/en/swsh6.json'
      - 'resources/cards/en/xy8.json'
      - 'resources/cards/en/sm2.json'
      - 'resources/cards/en/sv9.json'
      - '.github/workflows/validate-shadow-rider-guzma-damage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m results.tests.shadow_rider_guzma_damage.reproduce
