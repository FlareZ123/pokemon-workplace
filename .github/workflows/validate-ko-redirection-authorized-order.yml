name: Validate source-authorized KO redirection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ko_redirection_authorized_order.py"
      - "results/ko_redirection_authorized_order/**"
      - ".github/workflows/validate-ko-redirection-authorized-order.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/ko_redirection_authorized_order/reproduce.py
