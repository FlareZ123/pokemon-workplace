name: Validate agent2 Raichu Forest Seal search gate

on:
  push:
    paths:
      - "tools/raichu_prize_access.py"
      - "tools/raichu_forest_seal_search_gate.py"
      - "results/raichu_forest_seal_search_gate/**"
      - ".github/workflows/validate-agent2-raichu-forest-seal-search-gate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Forest Seal search-to-gate regressions
        run: PYTHONPATH=tools python results/raichu_forest_seal_search_gate/reproduce.py
