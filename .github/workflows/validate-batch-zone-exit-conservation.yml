name: Validate batch zone exit conservation

on:
  push:
    paths:
      - "tools/batch_zone_exit_conservation.py"
      - "tools/stack_zone_exit_conservation.py"
      - "tools/promotion_pending_conservation.py"
      - "tools/identity_materialization.py"
      - "tools/board_position_state.py"
      - "results/batch_zone_exit_conservation/**"
      - ".github/workflows/validate-batch-zone-exit-conservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check batch zone-exit conservation
        run: python results/batch_zone_exit_conservation/reproduce.py
