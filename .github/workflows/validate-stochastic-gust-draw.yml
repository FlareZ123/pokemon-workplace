name: Validate Stochastic Gust Draw

on:
  push:
    paths:
      - 'tools/stochastic_gust_draw.py'
      - 'tools/gust_prize_minimax.py'
      - 'results/stochastic_gust_draw/**'
      - '.github/workflows/validate-stochastic-gust-draw.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python results/stochastic_gust_draw/reproduce.py
