name: Validate Energy Recycle System action frontiers

on:
  push:
    paths:
      - "tools/energy_recycle_equivalence.py"
      - "results/energy_recycle_equivalence/**"
      - ".github/workflows/validate-energy-recycle-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enumerate physical Energy Recycle System actions
        run: python -m results.energy_recycle_equivalence.reproduce
