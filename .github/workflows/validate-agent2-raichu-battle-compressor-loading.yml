name: Validate agent2 Raichu Battle Compressor loading

on:
  push:
    paths:
      - "tools/battle_compressor_transaction.py"
      - "tools/raichu_electro_rain_als.py"
      - "results/raichu_battle_compressor_loading/**"
      - ".github/workflows/validate-agent2-raichu-battle-compressor-loading.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Raichu Battle Compressor loading regression
        run: PYTHONPATH=tools python results/raichu_battle_compressor_loading/reproduce.py
