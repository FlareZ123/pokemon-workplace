name: Validate Shadow Rider Stadium cut sensitivity
on:
  workflow_dispatch:

jobs:
  stadium-cut-frontier:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact physical Stadium source-swap fractions
        run: python -m results.tests.shadow_rider_path_cut_sensitivity.reproduce
