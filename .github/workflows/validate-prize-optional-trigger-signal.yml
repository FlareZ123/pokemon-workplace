name: Validate optional Prize-trigger signal

on:
  push:
    paths:
      - "tools/prize_optional_trigger_signal.py"
      - "results/prize_optional_trigger_signal/**"
      - ".github/workflows/validate-prize-optional-trigger-signal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Bayesian signal and material conservation
        run: python results/prize_optional_trigger_signal/reproduce.py
