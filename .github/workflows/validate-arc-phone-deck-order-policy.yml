name: Validate Arc Phone finite-deck policy

on:
  push:
    paths:
      - tools/arc_phone_deck_order_policy.py
      - results/arc_phone_deck_order_policy/**
      - .github/workflows/validate-arc-phone-deck-order-policy.yml
  workflow_dispatch:

jobs:
  prize-deck-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact physical deck and Prize oracle
        run: python -m results.arc_phone_deck_order_policy.reproduce
      - name: Exact sweep
        run: python -m results.arc_phone_deck_order_policy.sweep
