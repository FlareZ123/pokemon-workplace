name: Validate agent2 full Prized Raichu rescue

on:
  push:
    paths:
      - "tools/raichu_dark_asset_computer_followup_execution.py"
      - "tools/gladion_supporter_physical_transaction.py"
      - "tools/raichu_full_prized_rescue_execution.py"
      - "results/raichu_full_prized_rescue_execution/**"
      - ".github/workflows/validate-agent2-full-prized-raichu-rescue.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full Prized Raichu rescue regression
        run: PYTHONPATH=tools python results/raichu_full_prized_rescue_execution/reproduce.py
