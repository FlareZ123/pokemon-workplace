name: Validate Prize position/top swap

on:
  push:
    paths:
      - "tools/prize_position_top_swap.py"
      - "tools/prize_visibility_partition.py"
      - "tools/prize_belief_kernel.py"
      - "results/prize_position_top_swap/**"
      - ".github/workflows/validate-prize-position-top-swap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check positioned Prize/top-card beliefs
        run: python results/prize_position_top_swap/reproduce.py
