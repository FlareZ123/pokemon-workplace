name: Validate attack damage target geometry

on:
  push:
    paths:
      - "tools/attack_damage_target_geometry.py"
      - "tools/simple_attack_board_semantics.py"
      - "results/attack_damage_target_geometry/**"
      - ".github/workflows/validate-attack-damage-target-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check exact target geometry against Expanded card text
        run: python results/attack_damage_target_geometry/reproduce.py
