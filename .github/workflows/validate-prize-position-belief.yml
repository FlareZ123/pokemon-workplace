name: Validate Prize position belief

on:
  push:
    paths:
      - "tools/prize_position_belief.py"
      - "resources/cards/en/bw8.json"
      - "results/prize_supporter_execution/**"
      - "tools/action_quota_effects.py"
      - "tools/turn_action_budget.py"
      - "tools/prize_supporter_execution.py"
      - "tools/prize_position_policy.py"
      - "tools/peonia_arc_position.py"
      - "tools/repeated_prize_probe.py"
      - "tools/prize_top_draw_belief.py"
      - "tools/prize_top_swap_belief.py"
      - "tools/prize_slot_visibility.py"
      - "results/prize_position_belief/**"
      - "results/prize_position_policy/**"
      - "results/prize_terminal_utility_policy/**"
      - "results/prize_position_deadlines/**"
      - "results/peonia_arc_position/**"
      - "results/repeated_prize_probe/**"
      - "results/prize_top_draw_belief/**"
      - "resources/cards/en/swsh6.json"
      - "resources/cards/en/swsh11.json"
      - "resources/cards/en/swsh10.json"
      - "resources/cards/en/sm4.json"
      - "resources/manual/EN_advanced_manual-2025-transcription-structured.md"
      - ".github/workflows/validate-prize-position-belief.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Prize position belief
        run: python results/prize_position_belief/reproduce.py
      - name: Check Peonia Arc positional policy
        run: python results/peonia_arc_position/reproduce.py
      - name: Check correlated top-draw belief
        run: python results/prize_top_draw_belief/reproduce.py
      - name: Check repeated Prize probes
        run: python results/repeated_prize_probe/reproduce.py
      - name: Check Prize position policy
        run: python results/prize_position_policy/reproduce.py
      - name: Check state-dependent Prize utility policy
        run: python results/prize_terminal_utility_policy/reproduce.py
      - name: Check Prize position deadlines
        run: python results/prize_position_deadlines/reproduce.py
      - name: Check Prized Supporter execution
        run: python results/prize_supporter_execution/reproduce.py
