name: Validate Two-Sided Stochastic Escape

on:
  push:
    paths:
      - 'tools/two_sided_stochastic_escape.py'
      - 'results/two_sided_stochastic_escape/**'
      - '.github/workflows/validate-two-sided-stochastic-escape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python results/two_sided_stochastic_escape/reproduce.py
