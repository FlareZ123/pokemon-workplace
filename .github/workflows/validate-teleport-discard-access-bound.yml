name: Validate Teleport discard access bound

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/teleport_discard_access_bound.py"
      - "results/teleport_discard_access_bound/**"
      - ".github/workflows/validate-teleport-discard-access-bound.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check exact Prize and payment bounds
        run: python results/teleport_discard_access_bound/reproduce.py
