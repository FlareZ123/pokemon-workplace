name: Validate Prize slot choice signaling

on:
  push:
    paths:
      - "tools/prize_position_top_swap.py"
      - "results/prize_position_choice_signaling/**"
      - ".github/workflows/validate-prize-position-choice-signaling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate hidden-position signaling
        run: python results/prize_position_choice_signaling/reproduce.py
