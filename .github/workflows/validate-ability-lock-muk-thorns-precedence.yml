name: Validate Muk versus Thorns Ability-lock precedence

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/single_source_ability_lock_geometry.py"
      - "tools/ability_lock_dependency_graph.py"
      - "results/ability_lock_muk_thorns_precedence/**"
      - ".github/workflows/validate-ability-lock-muk-thorns-precedence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Alolan Muk versus Iron Thorns
        run: python results/ability_lock_muk_thorns_precedence/reproduce.py
