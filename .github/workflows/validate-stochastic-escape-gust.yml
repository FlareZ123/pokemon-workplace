name: Validate Stochastic Escape Gust

on:
  push:
    paths:
      - 'tools/stochastic_escape_gust.py'
      - 'results/stochastic_escape_gust/**'
      - '.github/workflows/validate-stochastic-escape-gust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python results/stochastic_escape_gust/reproduce.py
