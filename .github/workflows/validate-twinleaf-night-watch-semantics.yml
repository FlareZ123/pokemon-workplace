name: Audit pinned Twinleaf Night Watch random selection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  night-watch-randomness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout pinned Twinleaf gitlink only
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install pinned runtime dependencies
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Execute real card reducer and hidden-index prompt witness
        run: node simulation/twinleaf/test-night-watch-randomness.cjs
