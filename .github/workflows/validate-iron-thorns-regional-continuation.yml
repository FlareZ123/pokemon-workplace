name: Validate Iron Thorns regional continuation

on:
  push:
    paths:
      - "tools/iron_thorns_regional_failure_continuation.py"
      - "tools/iron_thorns_named_line_probability.py"
      - "tools/aichi_setup_inference.py"
      - "results/iron_thorns_regional_failure_continuation/reproduce.py"
      - ".github/workflows/validate-iron-thorns-regional-continuation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce regional failure continuation
        run: python results/iron_thorns_regional_failure_continuation/reproduce.py
