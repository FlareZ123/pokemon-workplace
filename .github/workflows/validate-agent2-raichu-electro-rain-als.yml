name: Validate agent2 Raichu Electro Rain ALS

on:
  push:
    paths:
      - "tools/raichu_electro_rain_als.py"
      - "results/raichu_electro_rain_als/**"
      - ".github/workflows/validate-agent2-raichu-electro-rain-als.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Raichu Electrode ALS regression
        run: PYTHONPATH=tools python results/raichu_electro_rain_als/reproduce.py
