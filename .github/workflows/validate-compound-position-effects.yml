name: Validate compound position effects

on:
  push:
    paths:
      - "tools/compound_position_effects.py"
      - "results/compound_position_effects/**"
      - ".github/workflows/validate-compound-position-effects.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/compound_position_effects/reproduce.py
