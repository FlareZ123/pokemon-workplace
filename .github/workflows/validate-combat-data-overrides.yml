name: Validate combat data overrides

on:
  push:
    paths:
      - "tools/combat_data_overrides.py"
      - "results/combat_data_overrides/**"
      - "resources/cards/en/me55.json"
      - "resources/cards/en/me55c.json"
      - ".github/workflows/validate-combat-data-overrides.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/combat_data_overrides/reproduce.py
