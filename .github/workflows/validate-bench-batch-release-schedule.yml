name: Validate typed batch Bench release schedule

on:
  push:
    paths:
      - tools/bench_batch_release_schedule.py
      - .github/workflows/validate-bench-batch-release-schedule.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate typed release timing and supporter windows
        run: python tools/bench_batch_release_schedule.py --self-test
      - name: Emit witness schedules
        run: python tools/bench_batch_release_schedule.py
