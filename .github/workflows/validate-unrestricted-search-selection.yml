name: Validate unrestricted search selection

on:
  push:
    paths:
      - "tools/unrestricted_search_selection.py"
      - "tools/build_expanded_legality_baseline.py"
      - "resources/cards/**"
      - "resources/sets/**"
      - "results/unrestricted_search_selection/**"
      - ".github/workflows/validate-unrestricted-search-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check unrestricted fixed-count search semantics
        run: python results/unrestricted_search_selection/reproduce.py
