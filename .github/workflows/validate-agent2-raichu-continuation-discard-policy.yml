name: Validate agent2 Raichu continuation discard policy

on:
  push:
    paths:
      - "tools/continuation_discard_policy.py"
      - "tools/raichu_full_prized_rescue_execution.py"
      - "results/raichu_continuation_discard_policy/**"
      - ".github/workflows/validate-agent2-raichu-continuation-discard-policy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run continuation-aware discard integration
        run: PYTHONPATH=tools python results/raichu_continuation_discard_policy/reproduce.py
