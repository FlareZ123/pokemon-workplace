name: Validate G&H typed search frontier

on:
  push:
    paths:
      - tools/gnh_typed_search_frontier.py
      - results/gnh_typed_search_frontier/**
      - .github/workflows/validate-gnh-typed-search-frontier.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check exhaustive physical action equivalence
        run: python -m results.gnh_typed_search_frontier.reproduce
