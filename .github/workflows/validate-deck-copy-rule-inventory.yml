name: validate deck copy-rule inventory

on:
  push:
    paths:
      - "tools/deck_validator.py"
      - "tools/deck_copy_rule_inventory.py"
      - "results/deck_copy_rule_inventory/**"
      - "results/deck_validator/reproduce.py"
      - ".github/workflows/validate-deck-copy-rule-inventory.yml"
  pull_request:
    paths:
      - "tools/deck_validator.py"
      - "tools/deck_copy_rule_inventory.py"
      - "results/deck_copy_rule_inventory/**"
      - "results/deck_validator/reproduce.py"
      - ".github/workflows/validate-deck-copy-rule-inventory.yml"
  workflow_dispatch:

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m results.deck_copy_rule_inventory.reproduce
      - run: python -m results.deck_validator.reproduce
      - run: python -m results.historical_deck_rules.reproduce
