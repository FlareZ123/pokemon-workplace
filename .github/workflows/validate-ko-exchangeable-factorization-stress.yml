name: Validate large exchangeable KO effect stress
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ko_order_component_factorization.py"
      - "tools/ko_order_signature_projection.py"
      - "tools/ko_order_zone_signature.py"
      - "results/ko_exchangeable_factorization_stress/**"
      - ".github/workflows/validate-ko-exchangeable-factorization-stress.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/ko_exchangeable_factorization_stress/reproduce.py
