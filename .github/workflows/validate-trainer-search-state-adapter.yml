name: Validate Trainer search state adapter

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/trainer_search_state_adapter.py"
      - "results/trainer_search_state_adapter/**"
      - ".github/workflows/validate-trainer-search-state-adapter.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Trainer search state adapter
        run: python results/trainer_search_state_adapter/reproduce.py
