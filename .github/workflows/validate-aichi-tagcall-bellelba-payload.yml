name: Validate Aichi Bellelba Tag Call payload

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/aichi_tagcall_bellelba_payload.py"
      - "results/aichi_tagcall_bellelba_payload/**"
      - ".github/workflows/validate-aichi-tagcall-bellelba-payload.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/aichi_tagcall_bellelba_payload/reproduce.py
