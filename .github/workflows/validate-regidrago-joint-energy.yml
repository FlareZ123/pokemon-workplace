name: Validate Regidrago joint Item and Energy gate

on:
  workflow_dispatch:

jobs:
  exact-physical:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify joint source and natural Energy gate
        run: python -m results.decks.regidrago_dragapult_2.joint_energy_reproduce
