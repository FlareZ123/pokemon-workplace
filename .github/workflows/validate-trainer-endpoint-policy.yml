name: Validate Trainer endpoint policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce endpoint policy
        run: python results/mixed_payload_connector_policy/reproduce.py
