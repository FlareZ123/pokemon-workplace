name: Validate fixed-deck Twinleaf Expanded bot

on:
  workflow_dispatch:
    inputs:
      deck_a:
        description: Tournament deck in player seat A
        type: choice
        required: true
        default: vileplume
        options:
          - vileplume
          - shadow_rider
          - regidrago
          - mew_genesect
          - absol_garbodor
      deck_b:
        description: Tournament deck in player seat B
        type: choice
        required: true
        default: mew_genesect
        options:
          - vileplume
          - shadow_rider
          - regidrago
          - mew_genesect
          - absol_garbodor
      seeds:
        description: One to three unique unsigned 32-bit seeds, separated by commas
        type: string
        required: true
        default: '20261012'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - name: Set up pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf server dependencies
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Restore pinned CommonJS compile cache
        id: twinleaf-cjs
        uses: actions/cache/restore@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Compile the CommonJS server used by research adapters
        if: steps.twinleaf-cjs.outputs.cache-hit != 'true'
        working-directory: vendor/twinleafgg/ptcg-server
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - name: Save compiled Twinleaf output, even if downstream tests fail
        if: steps.twinleaf-cjs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Run Expanded fixed-deck SFT
        run: node simulation/twinleaf/test-expanded-bot.cjs
      - name: Audit Aichi baseline exact-print coverage
        run: node simulation/twinleaf/test-print-coverage.cjs
      - name: Audit Aichi 10th-place Regidrago exact-print coverage
        run: node simulation/twinleaf/test-regidrago-print-coverage.cjs

      - name: Audit exact-paper tournament print coverage against pinned Twinleaf
        run: node simulation/twinleaf/test-tournament-print-audit.cjs twinleaf-print-coverage.json
      - name: Audit exact 2026 Aichi Mega Absol ex/Garbodor print and attack signatures
        run: node simulation/twinleaf/test-absol-print-audit.cjs twinleaf-absol-print-coverage.json
      - name: Preserve Mega Absol exact-print engine blockers
        uses: actions/upload-artifact@v4
        with:
          name: twinleaf-absol-print-coverage
          path: twinleaf-absol-print-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve detailed engine print blockers
        uses: actions/upload-artifact@v4
        with:
          name: twinleaf-print-coverage
          path: twinleaf-print-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate both Aichi tournament baselines as 60-card engine lists
        run: node simulation/twinleaf/test-baseline-decks.cjs
      - name: Check strict, complete Aichi 60-card Twinleaf deck materialization
        run: node simulation/twinleaf/test-tournament-deck-loader.cjs
      - name: Smoke-test experimental Mew Sky3 Path1 under pinned Twinleaf
        run: node simulation/twinleaf/test-mew-sky3-candidate.cjs
        timeout-minutes: 1
      - name: Enter a real Twinleaf turn with Aichi Vileplume and Mew exact 60-card lists
        run: node simulation/twinleaf/test-tournament-headless-setup.cjs
        timeout-minutes: 2
      - name: Reproduce pinned native shuffle bias and validate research-only hook
        run: node simulation/twinleaf/test-native-shuffle-bias.cjs
      - name: Verify physical game RNG is isolated from speculative policy evaluation
        run: node simulation/twinleaf/test-random-stream-ledger.cjs
      - name: Validate native hypothetical coin arbitration with Pokemon Catcher
        run: node simulation/twinleaf/test-counterfactual-coin-model.cjs
      - name: Check Shadow Rider Underworld Door target guard against real engine
        run: node simulation/twinleaf/test-underworld-door-targets.cjs
      - name: Verify paired-seat deck winners and censoring semantics
        run: node simulation/twinleaf/test-paired-result-summary.cjs
      - name: Audit seed-paired outcome interval estimator
        run: node simulation/twinleaf/test-paired-score-bounds.cjs
      - name: Audit compatible-run evidence ledger
        run: node simulation/twinleaf/test-matchup-evidence-ledger.cjs
      - name: Verify atomic JSON report artifact writer
        run: node simulation/twinleaf/test-report-atomic.cjs
      - name: Validate bounded manual matchup selections
        run: node simulation/twinleaf/test-tournament-probe-settings.cjs
      - name: Verify Regidrago Celestial Roar attaches all Energy card types
        run: node simulation/twinleaf/test-regidrago-celestial-roar.cjs
      - name: Verify Stoutland Wild Tackle source self-damage and coin branches
        run: node simulation/twinleaf/test-stoutland-wild-tackle.cjs
      - name: Verify live match installs legal Underworld Door target guard
        run: node simulation/twinleaf/test-tournament-engine-hooks.cjs
      - name: Collect seat-paired diagnostics for selected Aichi tournament lists
        run: node simulation/twinleaf/tournament-bounded-match.cjs
        timeout-minutes: 4
        env:
          TWINLEAF_DECK_A: ${{ inputs.deck_a }}
          TWINLEAF_DECK_B: ${{ inputs.deck_b }}
          TWINLEAF_SEEDS: ${{ inputs.seeds }}
          TWINLEAF_REPORT_PATH: tournament-match-report.json
      - name: Preserve paired source-controlled report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twinleaf-full-deck-matchup-report
          path: tournament-match-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Strictly map published Aichi Mega Absol print aliases and execute bounded headless diagnostic
        run: node simulation/twinleaf/test-absol-headless-sft.cjs
        timeout-minutes: 2
      - name: Smoke-test two headless Expanded bots in real game setup
        timeout-minutes: 1
        run: node simulation/twinleaf/test-headless-setup.cjs
      - name: Audit native Simulator live Card aliasing under hypothetical Switch
        run: node simulation/twinleaf/test-simulator-card-aliasing.cjs
