name: Validate fixed-deck Twinleaf Expanded bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - name: Set up pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf server dependencies
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Restore pinned CommonJS compile cache
        id: twinleaf-cjs
        uses: actions/cache/restore@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Compile the CommonJS server used by research adapters
        if: steps.twinleaf-cjs.outputs.cache-hit != 'true'
        working-directory: vendor/twinleafgg/ptcg-server
        run: ./node_modules/.bin/tsc --project tsconfig.json
      - name: Save compiled Twinleaf output, even if downstream tests fail
        if: steps.twinleaf-cjs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/twinleafgg/ptcg-server/output
          key: twinleaf-cjs-node20-${{ hashFiles('vendor/twinleafgg/ptcg-server/package-lock.json', 'vendor/twinleafgg/ptcg-server/tsconfig.json', 'vendor/twinleafgg/ptcg-server/src/**/*.ts') }}
      - name: Run Expanded fixed-deck SFT
        run: node simulation/twinleaf/test-expanded-bot.cjs
      - name: Audit Aichi baseline exact-print coverage
        run: node simulation/twinleaf/test-print-coverage.cjs
      - name: Audit Aichi 10th-place Regidrago exact-print coverage
        run: node simulation/twinleaf/test-regidrago-print-coverage.cjs

      - name: Audit exact-paper tournament print coverage against pinned Twinleaf
        run: node simulation/twinleaf/test-tournament-print-audit.cjs twinleaf-print-coverage.json
      - name: Preserve detailed engine print blockers
        uses: actions/upload-artifact@v4
        with:
          name: twinleaf-print-coverage
          path: twinleaf-print-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate both Aichi tournament baselines as 60-card engine lists
        run: node simulation/twinleaf/test-baseline-decks.cjs
      - name: Check strict, complete Aichi 60-card Twinleaf deck materialization
        run: node simulation/twinleaf/test-tournament-deck-loader.cjs
      - name: Enter a real Twinleaf turn with Aichi Vileplume and Mew exact 60-card lists
        run: node simulation/twinleaf/test-tournament-headless-setup.cjs
        timeout-minutes: 2
      - name: Check Shadow Rider Underworld Door target guard against real engine
        run: node simulation/twinleaf/test-underworld-door-targets.cjs
      - name: Smoke-test two headless Expanded bots in real game setup
        timeout-minutes: 1
        run: node simulation/twinleaf/test-headless-setup.cjs
