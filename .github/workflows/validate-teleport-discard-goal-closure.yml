name: Validate Teleport discard goal closure

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/teleport_discard_goal_closure.py"
      - "tools/teleport_discard_payload_line.py"
      - "results/teleport_discard_goal_closure/**"
      - ".github/workflows/validate-teleport-discard-goal-closure.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate exact and physical goal closure
        run: python results/teleport_discard_goal_closure/reproduce.py
