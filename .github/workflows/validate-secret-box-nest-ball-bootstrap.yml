name: Validate Secret Box Nest Ball bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/secret_box_nest_ball_bootstrap.py"
      - "tools/secret_box_gnh_tool_pipeline.py"
      - "results/secret_box_nest_ball_bootstrap/**"
      - ".github/workflows/validate-secret-box-nest-ball-bootstrap.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/secret_box_nest_ball_bootstrap/reproduce.py
