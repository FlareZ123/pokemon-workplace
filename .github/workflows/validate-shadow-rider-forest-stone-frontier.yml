name: Validate Shadow Rider Forest Seal Stone launch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Stone and Pokemon V physical opening frontiers
        run: python -m results.shadow_rider_forest_stone_frontier.reproduce
