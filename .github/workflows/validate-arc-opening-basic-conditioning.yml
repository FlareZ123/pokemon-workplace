name: Validate Arc opening Basic conditioning

on:
  push:
    paths:
      - tools/arc_opening_basic_conditioning.py
      - results/arc_opening_basic_conditioning/**
      - .github/workflows/validate-arc-opening-basic-conditioning.yml
  workflow_dispatch:

jobs:
  opening-basic-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m results.arc_opening_basic_conditioning.reproduce
