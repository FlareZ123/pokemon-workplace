name: Probe agent2 Raichu Dark Asset sensitivity

on:
  push:
    paths:
      - "tools/raichu_dark_asset_followup.py"
      - "results/raichu_dark_asset_followup_sensitivity/**"
      - ".github/workflows/probe-agent2-raichu-dark-asset-sensitivity.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run disposable-pool sensitivity
        run: PYTHONPATH=tools python results/raichu_dark_asset_followup_sensitivity/reproduce.py
