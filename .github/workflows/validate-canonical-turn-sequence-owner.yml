name: Validate canonical turn sequence owner

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/canonical_turn_sequence_owner.py"
      - "tools/unified_state_kernel.py"
      - "tools/legacy_turn_budget_bridge.py"
      - "tools/turn_action_budget.py"
      - "results/canonical_turn_sequence_owner/**"
      - ".github/workflows/validate-canonical-turn-sequence-owner.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce canonical turn scheduling
        run: python results/canonical_turn_sequence_owner/reproduce.py
