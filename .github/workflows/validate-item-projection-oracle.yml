name: Validate exact Item projection oracle

on:
  push:
    paths:
      - "results/secret_box_global_witnesses/item_exact_projection_oracle.py"
      - ".github/workflows/validate-item-projection-oracle.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/item_exact_projection_oracle.py
