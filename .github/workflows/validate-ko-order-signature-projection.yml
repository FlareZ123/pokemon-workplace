name: Validate signature-compressed KO projection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ko_order_signature_projection.py"
      - "tools/ko_order_zone_signature.py"
      - "tools/ko_order_outcome_space.py"
      - "tools/ko_order_terminal_projection.py"
      - "results/ko_order_signature_projection/**"
      - ".github/workflows/validate-ko-order-signature-projection.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/ko_order_signature_projection/reproduce.py
