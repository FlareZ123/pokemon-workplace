name: Validate Huntail versus Lost Out KO conflict
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ko_order_outcome_space.py"
      - "tools/ko_order_terminal_projection.py"
      - "tools/ko_order_signature_projection.py"
      - "results/huntail_lost_out_conflict/**"
      - ".github/workflows/validate-huntail-lost-out-conflict.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python results/huntail_lost_out_conflict/reproduce.py
