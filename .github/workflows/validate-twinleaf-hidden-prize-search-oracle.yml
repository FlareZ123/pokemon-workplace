name: Audit pinned Twinleaf Quick Ball hidden-Prize oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hidden-prize-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out research revision
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize exactly the pinned Twinleaf dependency
        run: git submodule update --init --depth=1 vendor/twinleafgg
      - name: Install Node for the pinned source
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleafgg/ptcg-server/package-lock.json
      - name: Install engine dependencies without lifecycle scripts
        working-directory: vendor/twinleafgg/ptcg-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise all 52 hidden Basic locations and complete-bot decisions
        run: node simulation/twinleaf/test-hidden-prize-search-oracle.cjs
      - name: Audit source Ultra Ball SVI and BRS plus Treasure with 156 hidden worlds
        run: node simulation/twinleaf/test-hidden-prize-extended-search-oracle.cjs
