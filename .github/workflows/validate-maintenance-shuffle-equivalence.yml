name: Validate historical Maintenance shuffle and draw equivalence

on:
  push:
    paths:
      - "tools/maintenance_shuffle_equivalence.py"
      - "results/maintenance_shuffle_equivalence/**"
      - ".github/workflows/validate-maintenance-shuffle-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exact Maintenance conditional-shuffle comparison
        run: python -m results.maintenance_shuffle_equivalence.reproduce
