name: Validate agent2 Raichu K0 discard policy

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/raichu_k0_discard_policy.py"
      - "results/raichu_k0_discard_policy/**"
      - ".github/workflows/validate-agent2-raichu-k0-discard-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Raichu K0 discard policy
        run: python results/raichu_k0_discard_policy/reproduce.py
