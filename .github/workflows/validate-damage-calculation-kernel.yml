name: Validate damage calculation kernel

on:
  push:
    paths:
      - "tools/damage_calculation_kernel.py"
      - "results/damage_calculation_kernel/**"
      - ".github/workflows/validate-damage-calculation-kernel.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/damage_calculation_kernel/reproduce.py
