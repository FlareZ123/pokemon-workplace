name: Validate legal Regidrago VIP-to-Dragapult swap

on:
  push:
    paths:
      - tools/regidrago_basic_search_frontier.py
      - results/regidrago_basic_search_frontier/**
      - .github/workflows/validate-regidrago-basic-search-frontier.yml
  workflow_dispatch:

jobs:
  exact-access-and-deck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact opening and print legality
        run: python results/regidrago_basic_search_frontier/reproduce.py
