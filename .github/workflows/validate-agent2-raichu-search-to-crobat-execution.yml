name: Validate agent2 Raichu search-to-Crobat execution

on:
  push:
    paths:
      - "tools/raichu_search_to_crobat_execution.py"
      - "results/raichu_search_to_crobat_execution/**"
      - ".github/workflows/validate-agent2-raichu-search-to-crobat-execution.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run physical search-to-Crobat regression
        run: PYTHONPATH=tools python results/raichu_search_to_crobat_execution/reproduce.py
