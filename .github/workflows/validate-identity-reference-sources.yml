name: Validate identity reference sources

on:
  push:
    paths:
      - "tools/identity_reference_sources.py"
      - "tools/identity_liveness.py"
      - "tools/top_prize_physical_bridge.py"
      - "tools/prize_pending_take.py"
      - "results/identity_reference_sources/**"
      - ".github/workflows/validate-identity-reference-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check identity reference sources
        run: python results/identity_reference_sources/reproduce.py
