name: Validate pending Prize batch correlations

on:
  push:
    paths:
      - "tools/pending_prize_batch_belief.py"
      - "tools/physical_pending_prize_batch_bridge.py"
      - "tools/pending_prize_identity_belief.py"
      - "tools/prize_pending_take.py"
      - "tools/top_prize_physical_bridge.py"
      - "results/pending_prize_batch_correlation/**"
      - ".github/workflows/validate-pending-prize-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Test correlated pending identities
        run: python results/pending_prize_batch_correlation/reproduce.py
