name: Validate effect evolution timing

on:
  push:
    paths:
      - "tools/effect_evolution_timing.py"
      - "results/effect_evolution_timing/**"
      - "tools/build_expanded_legality_baseline.py"
      - "resources/cards/en/**"
      - "resources/sets/en.json"
      - ".github/workflows/validate-effect-evolution-timing.yml"
  pull_request:
    paths:
      - "tools/effect_evolution_timing.py"
      - "results/effect_evolution_timing/**"
      - "tools/build_expanded_legality_baseline.py"
      - "resources/cards/en/**"
      - "resources/sets/en.json"
      - ".github/workflows/validate-effect-evolution-timing.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/effect_evolution_timing/reproduce.py
