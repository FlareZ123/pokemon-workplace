name: Validate arbitrary-unit Retreat payment DP

on:
  push:
    paths:
      - "tools/retreat_payment_polynomial_dp.py"
      - "tools/retreat_payment_symmetry.py"
      - "results/retreat_payment_polynomial_dp/**"
      - ".github/workflows/validate-retreat-payment-polynomial-dp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare mixed-unit DP against physical and orbit enumeration
        run: |
          python results/retreat_payment_polynomial_dp/reproduce.py
          python results/retreat_payment_branch_complexity/reproduce.py
