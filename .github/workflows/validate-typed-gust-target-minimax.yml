name: Validate Typed Gust Target Minimax

on:
  push:
    paths:
      - 'tools/typed_gust_target_minimax.py'
      - 'tools/trainer_gust_catalog.py'
      - 'results/typed_gust_target_minimax/**'
      - '.github/workflows/validate-typed-gust-target-minimax.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python results/typed_gust_target_minimax/reproduce.py
