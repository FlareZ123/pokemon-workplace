name: Validate Switch Access Window Theorem

on:
  push:
    paths:
      - 'tools/two_sided_stochastic_escape.py'
      - 'results/switch_access_window/**'
      - '.github/workflows/validate-switch-access-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python results/switch_access_window/reproduce.py
