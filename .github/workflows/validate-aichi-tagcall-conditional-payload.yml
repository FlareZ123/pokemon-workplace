name: Validate conditioned Bellelba payload

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/aichi_tagcall_conditional_payload.py"
      - "results/aichi_tagcall_conditional_payload/**"
      - ".github/workflows/validate-aichi-tagcall-conditional-payload.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/aichi_tagcall_conditional_payload/reproduce.py
