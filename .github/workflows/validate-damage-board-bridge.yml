name: Validate damage board bridge

on:
  push:
    paths:
      - "tools/damage_calculation_kernel.py"
      - "tools/damage_board_bridge.py"
      - "tools/board_object_kernel.py"
      - "results/damage_board_bridge/**"
      - "resources/cards/en/sv6.json"
      - ".github/workflows/validate-damage-board-bridge.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/damage_board_bridge/reproduce.py
