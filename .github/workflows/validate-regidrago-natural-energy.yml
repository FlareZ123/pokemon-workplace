name: Validate Regidrago natural Energy window

on:
  workflow_dispatch:

jobs:
  physical-oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Regidrago natural Energy draws
        run: python -m results.decks.regidrago_dragapult_2.energy_readiness_reproduce
