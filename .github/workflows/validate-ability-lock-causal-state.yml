name: Validate causal Ability lock state

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ability_lock_causal_state.py"
      - "tools/ability_lock_setup_precedence.py"
      - "tools/ability_lock_established_precedence.py"
      - "tools/ability_lock_dependency_graph.py"
      - "tools/single_source_ability_lock_geometry.py"
      - "results/ability_lock_causal_state/**"
      - ".github/workflows/validate-ability-lock-causal-state.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce causal Ability lock state
        run: python results/ability_lock_causal_state/reproduce.py
