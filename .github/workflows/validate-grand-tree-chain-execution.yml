name: Validate Grand Tree chained evolution

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/grand_tree_chain_execution.py"
      - "tools/effect_evolution_execution.py"
      - "tools/effect_evolution_source_gate.py"
      - "tools/effect_evolution_timing.py"
      - "tools/stadium_effect_instance_usage.py"
      - "results/grand_tree_chain_execution/**"
      - ".github/workflows/validate-grand-tree-chain-execution.yml"
  pull_request:
    paths:
      - "tools/grand_tree_chain_execution.py"
      - "tools/effect_evolution_execution.py"
      - "tools/effect_evolution_source_gate.py"
      - "tools/effect_evolution_timing.py"
      - "tools/stadium_effect_instance_usage.py"
      - "results/grand_tree_chain_execution/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/grand_tree_chain_execution/reproduce.py
