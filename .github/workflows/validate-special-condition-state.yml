name: Validate Special Condition state

on:
  push:
    paths:
      - "tools/special_condition_state.py"
      - "tools/conditioned_board_state.py"
      - "tools/checkup_order_value.py"
      - "tools/checkup_execution_kernel.py"
      - "tools/timed_special_conditions.py"
      - "tools/condition_turn_sequence.py"
      - "tools/turn_sequence_kernel.py"
      - "tools/board_object_kernel.py"
      - "tools/effect_order_authority.py"
      - "results/special_condition_state/**"
      - "results/conditioned_board_state/**"
      - "results/checkup_order_value/**"
      - "results/checkup_deferred_ko/**"
      - "results/timed_special_conditions/**"
      - "results/condition_turn_sequence/**"
      - ".github/workflows/validate-special-condition-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Special Condition payload semantics
        run: python results/special_condition_state/reproduce.py
      - name: Reproduce conditioned board synchronization
        run: python results/conditioned_board_state/reproduce.py
      - name: Reproduce Checkup ordering value
        run: python results/checkup_order_value/reproduce.py
      - name: Reproduce deferred Checkup Knock Out boundary
        run: python results/checkup_deferred_ko/reproduce.py
      - name: Reproduce timed Special Condition recovery
        run: python results/timed_special_conditions/reproduce.py
      - name: Reproduce skipped Checkup condition timing
        run: python results/condition_turn_sequence/reproduce.py
