name: Validate Special Condition state

on:
  push:
    paths:
      - "tools/special_condition_state.py"
      - "tools/conditioned_board_state.py"
      - "tools/checkup_order_value.py"
      - "tools/board_object_kernel.py"
      - "tools/effect_order_authority.py"
      - "results/special_condition_state/**"
      - "results/conditioned_board_state/**"
      - "results/checkup_order_value/**"
      - ".github/workflows/validate-special-condition-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce Special Condition payload semantics
        run: python results/special_condition_state/reproduce.py
      - name: Reproduce conditioned board synchronization
        run: python results/conditioned_board_state/reproduce.py
      - name: Reproduce Checkup ordering value
        run: python results/checkup_order_value/reproduce.py
