name: Validate Shadow Rider dual entry launch

on:
  push:
    paths:
      - "tools/shadow_rider_dual_entry_launch.py"
      - "tools/shadow_rider_stone_dual_entry.py"
      - "tools/shadow_rider_bonus_vmax_competition.py"
      - "tools/shadow_rider_conditional_vmax_draw.py"
      - "results/shadow_rider_dual_entry_launch/**"
      - "tools/opponent_bonus_matching.py"
      - "results/competitive_deck_baselines/shadow_rider_reproduce.py"
      - ".github/workflows/validate-shadow-rider-dual-entry-launch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check legal print texts, analytic access and physical toy oracles
        run: python results/shadow_rider_dual_entry_launch/reproduce.py
      - name: Check Forest Seal Stone fallback and physical resources
        run: python results/shadow_rider_dual_entry_launch/stone_reproduce.py
      - name: Validate paired bonus draw gains and VMAX target depletion
        run: python results/shadow_rider_dual_entry_launch/bonus_reproduce.py
      - name: Validate conditioned opening draw-restriction and physical positions
        run: python results/shadow_rider_dual_entry_launch/conditional_bonus_reproduce.py
