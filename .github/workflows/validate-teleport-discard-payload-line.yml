name: Validate Teleport discard payload line

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/teleport_discard_payload_line.py"
      - "results/teleport_discard_payload_line/**"
      - ".github/workflows/validate-teleport-discard-payload-line.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run Ultra Ball to Teleport Room bridge regression
        run: python results/teleport_discard_payload_line/reproduce.py
