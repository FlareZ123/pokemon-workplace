name: Validate intervening Bench action counterexample

on:
  push:
    paths:
      - tools/bench_contraction_intermediate_action.py
      - tools/bench_contraction_batch_conservation.py
      - .github/workflows/validate-bench-contraction-intermediate-action.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check print-specific action and conservation
        run: python tools/bench_contraction_intermediate_action.py --self-test
      - name: Print the nonconfluence witness
        run: python tools/bench_contraction_intermediate_action.py
