name: Validate Prize top draw pool

on:
  push:
    paths:
      - "tools/prize_top_draw_pool.py"
      - "tools/prize_position_top_swap.py"
      - "results/prize_top_draw_pool/**"
      - ".github/workflows/validate-prize-top-draw-pool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate correlated post-Arc Phone deck draw
        run: python results/prize_top_draw_pool/reproduce.py
