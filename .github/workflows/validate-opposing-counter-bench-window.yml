name: Validate opposing Counter Bench window

on:
  push:
    paths:
      - tools/two_sided_bidirectional_gust.py
      - results/opposing_counter_bench_window/**
      - .github/workflows/validate-opposing-counter-bench-window.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.opposing_counter_bench_window.reproduce
