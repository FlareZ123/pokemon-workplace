name: Validate opponent Prize race gust

on:
  push:
    paths:
      - tools/opponent_prize_race_gust.py
      - results/opponent_prize_race_gust/**
      - .github/workflows/validate-opponent-prize-race-gust.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.opponent_prize_race_gust.reproduce
