name: Validate Teleport Room into Grand Tree

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/teleport_grand_tree_bridge.py"
      - "tools/stadium_entry_channels.py"
      - "tools/stadium_effect_instance_usage.py"
      - "tools/grand_tree_chain_execution.py"
      - "tools/effect_evolution_source_gate.py"
      - "results/teleport_grand_tree_bridge/**"
      - ".github/workflows/validate-teleport-grand-tree-bridge.yml"
  pull_request:
    paths:
      - "tools/teleport_grand_tree_bridge.py"
      - "tools/stadium_entry_channels.py"
      - "tools/stadium_effect_instance_usage.py"
      - "tools/grand_tree_chain_execution.py"
      - "tools/effect_evolution_source_gate.py"
      - "results/teleport_grand_tree_bridge/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python results/teleport_grand_tree_bridge/reproduce.py
