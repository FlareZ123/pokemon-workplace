name: Validate Secret Box named recycling transactions
on:
  push:
    paths:
      - "results/secret_box_global_witnesses/named_recycling_transactions.py"
      - ".github/workflows/validate-secret-box-named-recycling.yml"
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python results/secret_box_global_witnesses/named_recycling_transactions.py
