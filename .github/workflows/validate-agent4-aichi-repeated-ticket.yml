name: Validate Aichi repeated Prize Tickets

on:
  push:
    paths:
      - "tools/aichi_repeated_ticket_access.py"
      - "results/aichi_repeated_ticket_access/**"
      - ".github/workflows/validate-agent4-aichi-repeated-ticket.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check physical reset blocks and simulated access
        run: python results/aichi_repeated_ticket_access/reproduce.py
