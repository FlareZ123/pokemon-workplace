name: Validate agent2 Raichu Forest Seal access

on:
  push:
    paths:
      - "tools/raichu_prize_access.py"
      - "tools/raichu_forest_seal_access.py"
      - "results/raichu_forest_seal_access/**"
      - ".github/workflows/validate-agent2-raichu-forest-seal.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run typed Forest Seal Stone regressions
        run: PYTHONPATH=tools python results/raichu_forest_seal_access/reproduce.py
