name: Validate shared connector model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run two-channel exact reproducer
        run: python results/shared_connector_contention/reproduce.py
      - name: Run multichannel exact reproducer
        run: python results/shared_connector_contention/reproduce_multichannel.py
      - name: Run connector capacity reproducer
        run: python results/connector_capacity_semantics/reproduce.py
      - name: Run connector profile access reproducer
        run: python results/connector_profile_access/reproduce.py
      - name: Run discard-gated multichannel reproducer
        run: python results/discard_gated_multichannel_access/reproduce.py
      - name: Run shared resource connector reproducer
        run: python results/resource_constrained_connectors/reproduce.py
      - name: Run multi-output search catalog reproducer
        run: python results/multi_output_search_catalog/reproduce.py
      - name: Run Trainer search profile compiler reproducer
        run: python results/trainer_search_profile_compiler/reproduce.py
