name: Validate Energy disruption compiler

on:
  push:
    paths:
      - "tools/energy_disruption_profile_compiler.py"
      - "tools/energy_disruption_executor.py"
      - "tools/stack_knockout_conservation.py"
      - "tools/identity_materialization.py"
      - "tools/build_expanded_legality_baseline.py"
      - "resources/cards/en/**"
      - "resources/sets/en.json"
      - "results/energy_disruption_profile_compiler/**"
      - ".github/workflows/validate-energy-disruption-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check one-card Energy disruption compiler and executor
        run: python results/energy_disruption_profile_compiler/reproduce.py
