name: Validate mixed gust opening access

on:
  push:
    paths:
      - tools/mixed_gust_opening_access.py
      - tools/gust_copy_opening_access.py
      - results/mixed_gust_opening_access/**
      - .github/workflows/validate-mixed-gust-opening-access.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m results.mixed_gust_opening_access.reproduce
