name: Validate Pokemon stack materialization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check stack materialization
        run: python results/pokemon_stack_materialization/reproduce.py
