name: Validate agent2 full backup rescue

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/raichu_backup_rescue_full_state.py"
      - "results/raichu_backup_rescue_full_state/**"
      - ".github/workflows/validate-agent2-raichu-backup-rescue-full-state.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reproduce full backup rescue
        run: python results/raichu_backup_rescue_full_state/reproduce.py
